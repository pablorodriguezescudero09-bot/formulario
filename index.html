:root[data-font="forgetica"]{
  --f-display:"Sans Forgetica", "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Sans Forgetica", "Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-math:"Sans Forgetica", "STIX Two Text", "Cambria Math", "Times New Roman", serif;
  --f-code:"Sans Forgetica", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
:root[data-font="forgetica"] body{font-size:16px;letter-spacing:.01em}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;}
.wrap{max-width:1280px;margin:0 auto;padding-inline:16px;padding-block:20px 96px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
header{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px 24px;align-items:start;margin-bottom:18px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.6rem,3.2vw,2.2rem);line-height:1.1;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:4px 0 0;max-width:62ch}
.store{font-size:.8rem;color:var(--muted);margin-top:4px}
.store b{color:var(--prima)}
.store b.warn{color:var(--mine)}
.store .btn{padding:1px 9px;font-size:.76rem;margin-left:6px;vertical-align:baseline}
.store .fname{font-family:var(--f-code);font-size:.78rem;color:var(--ink)}
#dlg{position:fixed;inset:0;z-index:60;background:rgba(10,15,25,.45);display:flex;align-items:center;justify-content:center;padding:16px}
#dlg .dlgcard{background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:20px 22px;max-width:520px;width:100%;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#dlg h3{margin:0 0 8px;font-family:var(--f-display)}
#dlg p{margin:0 0 14px;color:var(--muted)}
.welcome{max-width:62ch}
.welcome .ctrl{margin-top:14px}
.hctl{grid-column:1/-1;grid-row:2;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.hact{grid-column:2;grid-row:1;display:flex;align-items:center;gap:8px}
#gear{flex:none;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);color:var(--muted);cursor:pointer;display:grid;place-items:center;transition:transform .3s,color .2s}
#gear:hover{color:var(--ink);transform:rotate(40deg)}
#gear[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.devbar{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 18px;padding:10px 12px;border:1px dashed var(--line);border-radius:12px;background:var(--panel)}
.devbar b{font-family:var(--f-display);margin-right:4px}
.devbar .tabs button{padding:5px 13px}
.devbar .sp{flex:1}
.vkind{display:inline-block;font-family:var(--f-body);font-size:.68rem;font-weight:600;letter-spacing:.02em;text-transform:uppercase;color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:0 5px;margin-left:6px;vertical-align:1px}
.datosw{position:relative;margin:10px 0 4px;width:fit-content;max-width:100%;min-width:240px}
.datosw .datos{margin:0}
.datosw.blur .datos{filter:blur(7px);opacity:.75;user-select:none;pointer-events:none}
.datosw .reveal{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.datosw .reveal .btn{box-shadow:0 2px 10px rgba(0,0,0,.12)}
.datosw .hidedatos{margin-top:6px;font-size:.82rem}
main.ejblocked{border:2px solid var(--bad);background:var(--bad-soft)}
.ejlockmsg{color:var(--bad);font-weight:700;font-size:.92rem;margin:6px 0 10px}
.ejlock.on{background:var(--bad);border-color:var(--bad);color:#fff}
.apt{position:relative}
.apt.blocked{border:2px solid var(--bad);background:var(--bad-soft)}
.apt-lockb{position:absolute;top:10px;right:10px;font-size:.78rem;padding:3px 9px}
.apt-en{padding-right:112px}
.it.ejblk{border-color:var(--bad);background:var(--bad-soft)}
.ejchip.lock{color:var(--bad);border-color:var(--bad)}
.ejchip.exam{color:var(--prima);border-color:var(--prima)}
.kind.pau{background:var(--prima-soft);color:var(--prima);text-transform:none;letter-spacing:.01em}
.ejexform{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 10px;align-items:center}
.ejexform .inp{flex:1 1 240px;width:auto}
.ejexams{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.ejex{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--prima);color:var(--prima);border-radius:999px;padding:2px 4px 2px 10px;font-size:.85rem;font-weight:600}
.ejex button{border:0;background:transparent;color:inherit;cursor:pointer;font-size:1rem;line-height:1;padding:0 4px}
#pv .blkd{border:1.4px solid #c62828!important;background:#fdecea;border-radius:2mm;padding:2mm 3mm!important}
#pv .lkm{color:#c62828;font-weight:700}
.sqc{font-size:.8rem;color:var(--muted);margin:4px 0 6px}
.sqchip{display:inline-block;margin-left:6px;font-family:var(--f-body);font-size:.72rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;white-space:nowrap;vertical-align:1px}
.sqt{display:block;font-family:var(--f-body);font-size:.74rem;font-weight:400;color:var(--muted)}
.ejprog{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:2px 0 14px}
.ejst{font-weight:700;font-size:.92rem;margin-right:4px}
.ejst.done{color:var(--accent)}
.ejst.redo{color:var(--mine)}
.ejflag.on{background:var(--mine);border-color:var(--mine);color:#1a1205}
.ejmflag{color:var(--mine)}
.ejchip{display:inline-block;margin-left:6px;font-family:var(--f-body);font-size:.72rem;font-weight:600;color:var(--accent);border:1px solid var(--accent);border-radius:6px;padding:0 5px;white-space:nowrap;vertical-align:1px}
.ejchip.redo{color:var(--mine);border-color:var(--mine)}
.apt{border:1px solid var(--line);border-radius:14px;padding:14px 16px 6px;margin:16px 0;background:var(--paper)}
.apt-en{font-size:1.05rem;line-height:1.65;max-width:75ch}
.apt-l{font-family:var(--f-display);font-weight:800;color:var(--accent);margin-right:8px;font-size:1.1rem}
.apt-sol h3{margin:12px 0 6px;font-family:var(--f-display);font-size:1rem}
.apt-sol h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.8rem;margin-left:6px}
.pista-btn{border-color:var(--mine)}
.pistas{display:grid;gap:6px;margin:10px 0}
.pista{border-left:3px solid var(--mine);background:var(--panel);padding:7px 12px;border-radius:0 10px 10px 0;line-height:1.55}
.pista.enter{animation:pin .35s ease}
@keyframes pin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.ejtodo{margin-top:6px}
#pv .pe .pap{margin:2mm 0 0}
#pv .pe .plbl{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;font-weight:700;color:var(--accent);margin-top:2mm}
.tabs{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--panel)}
.tabs button{border:0;background:transparent;padding:7px 15px;cursor:pointer;font-family:var(--f-display);font-weight:700}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink)}
.toggles{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tg{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.88rem}
.tg .sw{width:28px;height:16px;border-radius:9px;background:var(--line);position:relative;transition:background .2s}
.tg .sw::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:var(--panel);transition:transform .2s}
.tg[aria-pressed="true"] .sw{background:var(--accent)}
.tg[aria-pressed="true"] .sw::after{transform:translateX(12px)}

/* Rejilla */
.layout{display:grid;gap:18px;grid-template-columns:minmax(0,1fr)}
@media (min-width:900px){.layout{grid-template-columns:minmax(0,310px) minmax(0,1fr);align-items:start}.layout.wide{grid-template-columns:minmax(0,1fr)}}
.layout.wide nav{display:none}
nav{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:900px){nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);max-height:calc(100vh - 24px);overflow-y:auto;padding-left:6px;margin-left:-6px;padding-right:8px;margin-right:-4px}}
.navtop{display:flex;flex-direction:column;gap:8px}
.search{display:flex;flex-direction:column;gap:5px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.search input,.inp{font-weight:400;text-transform:none;letter-spacing:0;font-size:.95rem;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:8px 10px;width:100%;min-width:0}
.search input:focus,.inp:focus{outline:none;border-color:var(--accent)}
textarea.inp{resize:vertical;min-height:2.6em;line-height:1.45}
.inp.code{font-family:var(--f-code);font-size:.88rem}
.mat{font-family:var(--f-display);font-size:.95rem;font-weight:700;margin:6px 0 2px;color:var(--ink)}
details.grp{border-left:2px solid var(--line);padding-left:8px}
details.grp>summary{cursor:pointer;list-style:none;font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:3px 0;display:flex;gap:6px;align-items:center}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::before{content:"▸";transition:transform .15s}
details.grp[open]>summary::before{transform:rotate(90deg)}
details.grp>summary .c{font-weight:400;letter-spacing:0}
.list{display:flex;flex-direction:column;gap:3px;margin-top:4px}
.it{display:grid;grid-template-columns:auto 1fr;gap:2px 8px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 10px;cursor:pointer;width:100%}
.it:hover{background:var(--panel);border-color:var(--line)}
.it.on{background:var(--panel);border-color:var(--accent)}
/* bloqueado: nunca vuelve al color normal; al pasar el cursor, granate y crece con un pequeño rebote */
.it.ejblk{position:relative;transition:transform .28s cubic-bezier(.34,1.56,.64,1),background-color .22s ease,border-color .22s ease,box-shadow .22s ease}
.it.ejblk.on{background:var(--bad-soft);border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
@media (hover:hover){.it.ejblk:hover{z-index:1;background:var(--maroon-soft);border-color:var(--maroon);transform:scale(1.03);box-shadow:0 5px 16px color-mix(in srgb,var(--maroon) 35%,transparent)}
.it.ejblk:hover .ejchip.lock{color:var(--maroon);border-color:var(--maroon)}}
.it.ejblk:focus-visible{z-index:1;background:var(--maroon-soft);border-color:var(--maroon);transform:scale(1.03)}
.dot{width:8px;height:8px;border-radius:50%;border:1.5px solid var(--muted);flex:none;display:inline-block}
.p>.dot,.p .dot,.dot.p{background:var(--prima);border-color:var(--prima)}
.it .nm{font-size:.9rem;line-height:1.25;min-width:0}
.it .mini{grid-column:2;font-family:var(--f-math);font-size:.95rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .mini .fr{font-size:.8em}
.legend{display:flex;gap:12px;font-size:.78rem;color:var(--muted);flex-wrap:wrap;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.star{color:var(--mine);font-weight:700}
.gi{display:grid;grid-template-columns:2.6em minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:1px solid transparent;background:transparent;border-radius:10px;padding:6px 10px;cursor:pointer;width:100%}
.gi:hover{background:var(--panel);border-color:var(--line)}
.gi.on{background:var(--panel);border-color:var(--accent)}
.gi .nm{font-size:.86rem;line-height:1.25}
.gs{font-family:var(--f-math);font-style:italic;font-size:1.25rem;text-align:center;line-height:1}
.gs sub,.gbig sub,.rs sub{font-size:.6em;font-style:normal}
.gc{font-size:.74rem;color:var(--muted);font-variant-numeric:tabular-nums;border:1px solid var(--line);border-radius:999px;padding:0 7px}

/* Panel principal */
main{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:clamp(16px,3vw,28px);min-width:0}
.ftop{display:flex;gap:10px 16px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.eyebrow{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kind{border-radius:999px;padding:2px 9px;font-weight:700;letter-spacing:.05em;font-size:.72rem;text-transform:uppercase}
.kind.p{background:var(--prima-soft);color:var(--prima)}
.kind.d{background:var(--accent-soft);color:var(--accent)}
.kind.m{background:var(--mine-soft);color:var(--mine)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
main h2{font-family:var(--f-display);font-size:clamp(1.3rem,2.6vw,1.75rem);margin:6px 0 14px;line-height:1.15;text-wrap:balance}
.big{position:relative;font-family:var(--f-math);font-size:clamp(1.5rem,4.2vw,2.5rem);padding:18px 8px;margin:0 0 10px;overflow-x:auto;border-block:1px dashed var(--line);display:flex;justify-content:center}
.big.veil .eq{filter:blur(10px);pointer-events:none;user-select:none}
.big .veilmsg{display:none}
.big.veil{cursor:pointer}
.big.veil .veilmsg{display:flex;position:absolute;inset:0;align-items:center;justify-content:center;font-family:var(--f-body);font-size:.95rem;color:var(--muted)}
.note{color:var(--muted);max-width:70ch;margin:0 0 6px}
.blk{margin-top:22px}
.blk>h3{font-family:var(--f-display);font-size:1rem;margin:0 0 10px;display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.blk>h3 small{font-family:var(--f-body);font-weight:400;color:var(--muted);font-size:.85rem}
.errbox{border:1px solid var(--bad);background:var(--bad-soft);color:var(--bad);border-radius:10px;padding:8px 12px;font-size:.88rem}
.okbox{border:1px solid var(--prima);background:var(--prima-soft);color:var(--prima);border-radius:10px;padding:8px 12px;font-size:.88rem}
.warnbox{border:1px solid var(--mine);background:var(--mine-soft);color:var(--mine);border-radius:10px;padding:8px 12px;font-size:.88rem}
.errbox ul,.warnbox ul{margin:4px 0 0;padding-left:1.2em}

/* Matemáticas */
.eq{display:inline-flex;align-items:center;flex-wrap:nowrap;white-space:nowrap;line-height:1.2}
.eqs{margin:0 .35em}
.op{margin:0 .22em}
.op.dot{margin:0 .08em;width:auto;height:auto;border:0;border-radius:0;display:inline;background:none}   /* el punto de multiplicar no es el circulito .dot del índice */
.jx{display:inline-block;width:.08em}
.v{font-style:italic;cursor:help;border-radius:.2em;padding:0 .04em;transition:background .15s,color .15s}
.v[data-k]:hover,.v.act{background:var(--accent-soft);color:var(--accent)}
.v.bad{color:var(--bad);text-decoration:wavy underline}
.v sub,.v sup{font-size:.62em;font-style:normal}
.n{font-style:normal}
.fn{font-style:normal;margin-right:.06em}
.tx{font-style:normal}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;font-size:.92em}
.fr>.nu{padding:0 .25em .06em;border-bottom:.06em solid currentColor}
.fr>.de{padding:.06em .25em 0}
.fr .fr{font-size:.9em}
sup{font-size:.62em;vertical-align:.7em;line-height:0;margin-left:.03em}
.pw{white-space:nowrap}
.pw.tall{display:inline-flex;align-items:flex-start}
.pw.tall>sup{line-height:1.1}
sup .hl{line-height:1.15}
sup .fr{font-size:.95em;vertical-align:middle;line-height:1.15}
sup .fr>*{line-height:1.15}   /* fracciones en exponentes: sin el line-height 0 del sup */
.sq{display:inline-flex;align-items:center}
.rad{line-height:1;margin-right:-.02em}
.sq.tall .rad{font-size:1.75em}
.sqb{border-top:.06em solid currentColor;padding:.06em .12em 0 .06em;display:inline-flex;align-items:center}
.pg{display:inline-flex;align-items:center}
.pa{font-style:normal}
.pg .pa.tall{font-size:1.7em;line-height:1;transform:scaleX(.75)}
.hl{border-radius:.22em;padding:0 .08em;display:inline-flex;align-items:center}
.hin{background:var(--hl);color:var(--hl-ink);box-shadow:0 0 0 .06em var(--hl)}
.hout{outline:.08em dashed var(--pen);outline-offset:.05em;color:var(--pen)}
.mi{font-family:var(--f-math);font-size:1.08em}

/* Controles */
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:44px;height:44px;padding:0 12px;border-radius:10px;border:1px solid var(--line);background:var(--paper);cursor:pointer;font-family:var(--f-math);font-size:1.3rem;font-style:italic;display:inline-flex;align-items:center;justify-content:center}
.chip sub,.chip sup{font-size:.62em;font-style:normal}
.chip:hover{border-color:var(--accent)}
.chip.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chip:disabled{opacity:.4;cursor:not-allowed}
.hint{font-size:.85rem;color:var(--muted);margin:8px 0 0}
.seg{display:inline-flex;align-items:center;gap:8px;font-size:.86rem;color:var(--muted);flex-wrap:wrap}
.seg .opts{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.seg button{border:0;background:var(--paper);padding:6px 11px;cursor:pointer;color:var(--ink)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.ctrl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.btn{border:1px solid var(--line);background:var(--paper);border-radius:9px;padding:7px 13px;cursor:pointer;font-size:.88rem}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{border-color:var(--bad);color:var(--bad)}
.btn.danger.pri{background:var(--bad);color:var(--panel)}
.btn:disabled{opacity:.45;cursor:default}
.mark{border:1.5px solid var(--mine);background:transparent;color:var(--mine);border-radius:999px;padding:6px 14px;cursor:pointer;font-weight:700;font-size:.86rem}
.mark:hover{background:var(--mine-soft)}
.mark.on{background:var(--mine);color:var(--panel)}
select.inp{padding:7px 8px}

/* Pasos */
ol.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
ol.steps li{display:grid;grid-template-columns:30px minmax(0,1fr);gap:10px;align-items:start}
.num{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:2px}
.cap{font-size:.9rem;color:var(--muted);margin-bottom:4px}
.ded .cap{color:var(--ink);font-size:.93rem}
.cap b{color:var(--ink)}
.cap .m{font-family:var(--f-math);font-size:1.12em;color:var(--pen);white-space:nowrap}
.sline{font-family:var(--f-math);font-size:clamp(1.12rem,2.6vw,1.42rem);overflow-x:auto;padding:4px 2px}
li.final .sline .eq{border:2px solid var(--accent);border-radius:10px;padding:6px 14px}
li.final .num{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
li.enter{animation:in .35s ease-out}
@keyframes in{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){li.enter{animation:none}*{transition:none!important}}
.key{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:12px}
.key span{display:inline-flex;gap:6px;align-items:center}
.key .k1{display:inline-block;width:18px;height:12px;border-radius:3px;background:var(--hl)}
.key .k2{display:inline-block;width:18px;height:12px;border-radius:3px;outline:1.5px dashed var(--pen)}
.uses{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.use{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:3px 11px;font-size:.8rem;cursor:pointer;color:var(--muted)}
.use.p{border-color:var(--prima);color:var(--prima)}
.use.miss{border-style:dashed;color:var(--bad);cursor:default}
.use:hover{color:var(--accent);border-color:var(--accent)}

/* Calculadora */
.calc{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.fld{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:var(--paper)}
.fld .sym{font-family:var(--f-math);font-size:1.25rem;min-width:1.4em}
.fld input{width:100%;min-width:0;border:0;background:transparent;font-variant-numeric:tabular-nums;color:var(--ink);padding:4px 0}
.fld input:focus{outline:none}
.fld:focus-within{border-color:var(--accent)}
.fld .u{font-size:.8rem;color:var(--muted);white-space:nowrap}
.res{margin-top:10px;font-family:var(--f-math);font-size:1.3rem;display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.res .msg{font-family:var(--f-body);font-size:.88rem;color:var(--muted)}
.res .val{font-variant-numeric:tabular-nums}

/* Relaciones */
.rels{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rel{border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.86rem;display:inline-flex;gap:6px;align-items:center}
.rel:hover{border-color:var(--accent)}
.rs{font-family:var(--f-math);font-style:italic;font-size:1.1rem}
.rc{color:var(--muted);font-variant-numeric:tabular-nums}

/* Glosario */
.ghead{display:flex;gap:20px;align-items:center;flex-wrap:wrap;margin-top:6px}
.gbig{font-family:var(--f-math);font-style:italic;font-size:clamp(3rem,8vw,4.4rem);line-height:1;min-width:1.2em;text-align:center;color:var(--accent)}
.ghead h2{margin:0 0 6px}
.ghead>div{min-width:0;flex:1 1 240px}
.gunit{font-family:var(--f-math);font-size:1.2rem}

<script>
/* ==================================================================
   FORMULARIO · app de fórmulas sobre datos (formato "formulario-v1")
   Secciones:
   1. Datos de partida (paquete inicial y prompt para la IA)
   2. Lector de ecuaciones (parser), simplificador y despeje
   3. Dibujo de ecuaciones y texto enriquecido
   4. Almacén: paquete base + cambios del usuario (cuenta y navegador)
   5. Validación e importación de paquetes
   6. Vistas: fórmulas, glosario, mapa de nodos, mis datos, editor
   7. Eventos
   ================================================================== */

/* ============ 1. DATOS DE PARTIDA ============ */
// Los datos ya no van dentro de la app: viven en un archivo .json aparte (la «biblioteca»).
// LIB es la biblioteca tal y como se leyó del archivo (o de la copia guardada en este navegador).
let LIB=emptyLib();
const PROMPT = "# Prompt para convertir apuntes en fórmulas para mi app «Formulario»\n\n## Tu papel\n\nEres un profesor de ciencias de bachillerato y universidad, riguroso y muy claro, que además sabe preparar datos para una aplicación. Voy a darte unos **apuntes** (texto, PDF o fotos). Tu trabajo es extraer de ellos **todas las fórmulas que hacen falta para estudiar ese tema y resolver sus ejercicios**, organizarlas y responderme con **un único bloque de código** que pegaré en mi app «Formulario». La app lo valida: si hay un solo error de formato, lo rechaza. Por eso las reglas de este documento son estrictas y hay que cumplirlas al pie de la letra.\n\nLa app hace con cada fórmula lo siguiente, y tus datos tienen que permitirlo:\n\n- La muestra dibujada (fracciones, raíces, potencias).\n- Al pulsar cada símbolo enseña qué es y su unidad en el S.I.\n- **Despeja automáticamente** la incógnita que yo elija, paso a paso.\n- Enseña **cómo se deduce** la fórmula, paso a paso, enlazando con las fórmulas de las que sale.\n- Distingue **fórmulas primas** (pocas, cortas, de las que se deduce todo) de **deducidas**.\n- Tiene un glosario de magnitudes y un mapa de nodos con quién sale de quién.\n- Tiene una calculadora que usa las unidades y los valores por defecto.\n- Dibuja **gráficas** de funciones (x(t), v(t), energía frente a elongación…) a partir de ecuaciones, con parámetros que el alumno puede cambiar.\n- En Matemáticas, **estudia funciones f(x)**: dominio, cortes, signo, simetría, asíntotas, derivadas, monotonía, extremos, curvatura e inflexión, con gráfica.\n- Tiene **ejercicios resueltos** en los que la propia app calcula cada paso: tú solo dices qué fórmula se aplica y qué incógnita se despeja; la app enseña la fórmula (enlazada a su ficha), el despeje, la sustitución con los números y el resultado con unidades. La solución está oculta hasta que el alumno la pide.\n- Dibuja **diagramas técnicos** (hierro-carbono, ensayo de tracción, ciclos…) con zonas, líneas y puntos explicados al pasar el cursor, y permite medir pendientes sobre ellos.\n\n## Lo que tienes que hacer\n\n1. Lee los apuntes completos. Identifica el tema o temas (por ejemplo «Campo eléctrico», «Cinética química»).\n2. Elige las **fórmulas primas** de cada tema: entre 3 y 7 por tema. Deben ser **cortas, fáciles de memorizar y suficientes para deducir todas las demás**. Suelen ser definiciones y leyes fundamentales. No elijas cosas triviales (como f = 1/T sola, si encaja como nota de otra) ni fórmulas largas que se deducen de otras.\n3. Recoge como **deducidas** todas las demás fórmulas de los apuntes, y además las que se usan habitualmente en los ejercicios de ese tema aunque los apuntes no las escriban aparte (valores máximos, casos particulares, relaciones entre dos situaciones, sumas, etc.).\n4. Para **cada** fórmula (primas incluidas) escribe la **deducción paso a paso**. En una prima, de dónde sale: definición, ley experimental, geometría… En una deducida, cómo se llega a ella desde otras fórmulas, citándolas.\n5. Define **cada magnitud** que aparezca en cualquier ecuación: símbolo, significado preciso y unidad S.I.\n6. Escribe en cada fórmula una **nota** útil para examen: cuándo se aplica, convenios de signos, trampas típicas y rango de validez.\n7. Propón **gráficas** donde ayuden a ver el tema (ver GRAFICA): entre 1 y 3 por tema, solo si aportan algo (una magnitud frente al tiempo o a la posición, varias curvas comparadas en los mismos ejes…).\n8. Escribe **ejercicios resueltos** (ver EJERCICIO): entre 2 y 5 por tema, los de los apuntes y los típicos de examen, usando solo fórmulas del paquete o del catálogo. Da los datos en unidades S.I. ya convertidas.\n9. Si los apuntes tienen **diagramas técnicos** (hierro-carbono, ensayo de tracción, ciclo de Carnot, curvas características…), descríbelos como DIAGRAMA con sus zonas, líneas y puntos explicados.\n10. Revisa todo con la lista de autoverificación del final y responde con el formato exacto.\n\n## Formato exacto de tu respuesta\n\nTu respuesta tiene **tres partes, en este orden, y nada más**:\n\n1. Una sola línea de resumen, por ejemplo: `Paquete: 2 temas, 14 fórmulas (6 primas), 23 magnitudes nuevas, 3 gráficas.`\n2. **Un único bloque de código** marcado como `json` con el paquete completo (estructura más abajo). Es JSON estricto: comillas dobles, sin comentarios, sin comas finales y sin texto fuera del objeto.\n3. Opcional: una sección `Dudas:` con viñetas, solo si algo de los apuntes era ambiguo, ilegible o contradictorio, o si has añadido algo que no estaba en ellos.\n\nNo escribas ningún otro bloque de código, ni explicaciones largas, ni el JSON en varios trozos. Si el paquete es muy grande, sigue escribiendo hasta cerrarlo; nunca lo cortes.\n\n## Estructura del paquete\n\n```\n{\n  \"formato\": \"formulario-v1\",\n  \"titulo\": \"texto corto que describe el paquete\",\n  \"temas\": [ TEMA, ... ],\n  \"magnitudes\": { \"clave\": MAGNITUD, ... },\n  \"formulas\": [ FORMULA, ... ],\n  \"graficas\": [ GRAFICA, ... ],\n  \"funciones\": [ FUNCION, ... ],\n  \"ejercicios\": [ EJERCICIO, ... ],\n  \"diagramas\": [ DIAGRAMA, ... ]\n}\n```\n\nLos cinco primeros campos son obligatorios; `graficas`, `funciones`, `ejercicios` y `diagramas` son opcionales (pueden faltar o ser listas vacías). `formato` vale siempre exactamente `\"formulario-v1\"`.\n\n### TEMA\n\n```\n{ \"id\": \"CampoE\", \"nombre\": \"Campo eléctrico\", \"materia\": \"Física\" }\n```\n\n- `id`: corto, sin espacios ni tildes, solo letras, números y `_`. Único.\n- `nombre`: el nombre que verá el alumno.\n- `materia`: la asignatura (`Física`, `Química`, `Matemáticas`…). Agrupa los temas en la app.\n- Si un tema ya existe en el catálogo de la app (al final de este documento), **no lo vuelvas a declarar**: usa su `id` en las fórmulas.\n\n### MAGNITUD\n\nEs un objeto dentro de `\"magnitudes\"`, con su **clave** como nombre del campo:\n\n```\n\"vF\": { \"simbolo\": \"v_{F}\", \"nombre\": \"Velocidad de la fuente emisora\", \"unidad\": \"m/s\" }\n\"I0\": { \"simbolo\": \"I_{0}\", \"nombre\": \"Intensidad umbral de audición\", \"unidad\": \"W/m²\", \"nota\": \"Vale 10⁻¹² W/m².\", \"valor\": \"1e-12\" }\n```\n\n- **Clave**: es el nombre con el que la magnitud se escribe dentro de las ecuaciones. Solo letras ASCII, números y `_`, empezando por letra: `v`, `vF`, `lam`, `beta1`, `Ec`. Distingue mayúsculas: `K` y `k` son magnitudes distintas.\n- **Claves prohibidas**, porque están reservadas: `sin`, `cos`, `tan`, `asin`, `acos`, `atan`, `sen`, `tg`, `log`, `ln`, `exp`, `sqrt`, `pi`.\n- **Misma letra, distinto significado ⇒ clave distinta.** Ejemplo: la x de elongación (`x`) y la x de distancia al foco (`xp`); la v de la partícula (`vel`) y la v de propagación (`v`). Es obligatorio, porque la app enseña el significado y la unidad de cada clave.\n- `simbolo`: cómo se escribe en el papel. Subíndice con `_{...}` y superíndice con `^{...}`: `v_{máx}`, `E_{c}`, `β_{1}`. Se admiten letras griegas y Unicode: `ω`, `λ`, `Δφ`, `f′`.\n- `nombre`: significado preciso, sin ambigüedad, en una frase corta.\n- `unidad`: la unidad del S.I. (`m`, `m/s`, `rad/s`, `N/m`, `W/m²`, `J`, `Hz`, `mol/L`…). Para números puros, escribe `adimensional`. Los ángulos van en `rad`.\n- `nota` (opcional): equivalencias (`1 N = 1 kg·m/s²`), valores típicos o confusiones habituales.\n- `valor` (opcional): **solo para constantes** con valor fijo (g, c, G, R, I₀…), como texto numérico con punto decimal: `\"9.8\"`, `\"3e8\"`. La calculadora lo rellena solo.\n- `alias` (opcional, recomendado): lista de otras formas de llamarla, para el buscador. El alumno no las ve nunca: `[\"velocidad angular\", \"frecuencia angular\", \"omega\"]`.\n- Si una magnitud ya existe en el catálogo **con el mismo significado**, no la declares: usa su clave. Si existe una clave igual con **otro** significado, crea una clave nueva distinta.\n\n### FORMULA\n\n```\n{\n  \"id\": \"mas_periodo_muelle\",\n  \"tema\": \"MAS\",\n  \"tipo\": \"deducida\",\n  \"nombre\": \"Período de un muelle\",\n  \"ecuacion\": \"T = 2*pi*sqrt(m/K)\",\n  \"nota\": \"Depende de la masa porque la fuerza es elástica.\",\n  \"deDonde\": [\"mas_pulsacion\", \"mas_dinamica\"],\n  \"pasos\": [ PASO, ... ],\n  \"variantes\": [ VARIANTE, ... ]\n}\n```\n\n- `id`: único, solo minúsculas, números y `_`. Empieza por un prefijo del tema: `campoe_coulomb`, `cin_vida_media`. No repitas ids del catálogo, salvo que quieras **reemplazar** a propósito esa fórmula (dilo en `Dudas`).\n- `tema`: el `id` de un tema de este paquete o del catálogo.\n- `tipo`: `\"prima\"` o `\"deducida\"`.\n- `nombre`: nombre corto y claro (2–6 palabras).\n- `ecuacion`: **una sola igualdad** (un único `=`) con la sintaxis de la sección siguiente. A la izquierda va la magnitud tal y como se suele memorizar la fórmula.\n- `nota`: obligatoria en la práctica. Una o dos frases de lo que hay que saber para el examen.\n- `deDonde`: ids de las fórmulas **de las que sale directamente**, solo un nivel. Las primas suelen llevarlo vacío o no llevarlo. Una deducida debe llevarlo, salvo que salga de una ley experimental (entonces explícalo en los pasos).\n- `pasos`: la deducción, obligatoria (ver PASO).\n- `materias` (opcional): otras asignaturas en las que esta misma fórmula también debe verse, p. ej. [\"Tecnología\"]. Úsalo en vez de repetir una fórmula: la app la enseña en las dos asignaturas sin duplicarla. Si una fórmula que necesitas ya está en el catálogo en otra asignatura, no la vuelvas a declarar: cítala por su `id` en `deDonde` o `usa` y dímelo en Dudas.\n- `alias` (recomendado): de 3 a 6 nombres más con los que un alumno buscaría esta fórmula: nombre clásico, nombre coloquial, con y sin tilde no hace falta. El alumno no los ve nunca, solo sirven para encontrarla. Ejemplo: `[\"periodo del resorte\", \"oscilador masa-muelle\", \"tiempo de una oscilación\"]`.\n- `escrita` (recomendado): de 1 a 3 formas de escribir la ecuación con teclado cuando un alumno la escribiría con otras letras que las de `ecuacion` o en otro orden. Mismo formato que `ecuacion` (con `*`, `^`, `sqrt()`, un solo `=`), pero aquí se puede usar cualquier letra sin declararla. Ejemplo: `[\"T = 2*pi*sqrt(m/k)\"]`. Tampoco se enseña.\n- `variantes` (opcional): solo si la misma fórmula tiene **casos de signo o de situación** que cambian la ecuación (efecto Doppler acercándose o alejándose, lente convergente o divergente…). Entonces `ecuacion` es la primera variante.\n\n### PASO\n\n```\n{ \"texto\": \"De la dinámica del MAS despejamos ω:\", \"ecuacion\": \"w = sqrt(K/m)\", \"usa\": [\"mas_dinamica\"] }\n```\n\n- `texto`: **una idea por paso**, en español claro. Di qué se hace y por qué («Sustituimos…», «Como sen² + cos² = 1…», «Para ángulos pequeños…»). Puedes usar Unicode (ω, ², ½, ⇒), `**negrita**` y fórmulas cortas entre dólares con la sintaxis de ecuaciones: `$K = m*w^2$`.\n- `ecuacion`: lo que queda escrito tras ese paso. Puede ser un texto o una **lista** de textos si el paso tiene varias ecuaciones: `[\"T = 2*pi/w\", \"lam = 2*pi/k\"]`. En los pasos se permiten **cadenas**: `a = b = c`, `≈` (escríbelo `~`) y `∝`. Envuelve entre corchetes `[ ... ]` **lo que se sustituye o lo que cambia** en ese paso: la app lo resalta en amarillo. Ejemplo: `\"E = 1/2*[K]*A^2\"`.\n- `usa` (opcional): ids de las fórmulas que se usan **en ese paso**. Se convierten en botones para ir a ellas.\n- Entre 2 y 6 pasos por fórmula. **El último paso debe terminar exactamente en la fórmula** (`ecuacion` igual al de la fórmula). Si la fórmula tiene `variantes`, el último paso puede ser `\"@\"`, que la app sustituye por la variante elegida.\n- En las primas, los pasos explican **de dónde sale**: definición, ley experimental, geometría, comprobación de casos extremos.\n\n### GRAFICA\n\n```\n{\n  \"id\": \"mas_x_v_t\", \"tema\": \"MAS\", \"titulo\": \"Posición y velocidad frente al tiempo\",\n  \"x\": \"t\", \"rango\": [0, 2],\n  \"series\": [\n    { \"nombre\": \"x(t)\", \"ecuacion\": \"x = A*sin(w*t+phi)\" },\n    { \"nombre\": \"v(t)\", \"ecuacion\": \"vel = A*w*cos(w*t+phi)\" }\n  ],\n  \"valores\": { \"A\": 0.1, \"w\": 3.14, \"phi\": 0 },\n  \"marcas\": [ { \"x\": \"2*pi/w\", \"texto\": \"T\" } ],\n  \"formulas\": [\"mas_posicion\", \"mas_velocidad\"],\n  \"nota\": \"La velocidad va un cuarto de período por delante de la posición: es máxima cuando x = 0.\"\n}\n```\n\n- `id`: único, con las mismas reglas y prefijo de tema que las fórmulas.\n- `tema`: `id` de un tema del paquete o del catálogo.\n- `titulo`: lo que verá el alumno (3–8 palabras).\n- `x`: la clave de la magnitud del **eje horizontal** (tiempo, posición, distancia…). Debe estar declarada.\n- `rango`: `[mínimo, máximo]` de `x`, dos números en unidades S.I. Elige el tramo que enseña lo importante (uno o dos períodos, hasta donde la curva se aplana…).\n- `series`: de 1 a 4 curvas. Cada una tiene `nombre` (texto corto; admite $fórmula$) y `ecuacion` con la sintaxis de la sección siguiente: a la izquierda **solo la clave** de la magnitud que se dibuja; a la derecha una expresión de `x` y de otras magnitudes. Las curvas de una misma gráfica deben tener sentido en los mismos ejes.\n- `valores`: un número (sin comillas, sin unidades) para **cada** magnitud que aparezca a la derecha y no sea `x`. Valores realistas y redondos. Las constantes que ya tienen `valor` en su magnitud (g, I0…) no hace falta repetirlas. El alumno podrá cambiarlos en la app.\n- `rangoY` (opcional): `[mínimo, máximo]` del eje vertical si la escala automática no conviene (asíntotas, 1/r²…).\n- `marcas` (opcional): líneas verticales con etiqueta en valores señalados de `x`. Su `x` es un número o una expresión de las magnitudes con valor (`\"2*pi/w\"`, `\"lam/2\"`).\n- `formulas`: ids de las fórmulas con las que se relaciona (del paquete o del catálogo). La gráfica aparece en la ficha de cada una. Pon al menos una.\n- `nota` (opcional): una frase sobre en qué fijarse (desfases, máximos, dónde se anula, qué pasa al cambiar un parámetro).\n- Buenas gráficas: x, v y a frente a t en el MAS; energías cinética, potencial y total frente a x; intensidad frente a la distancia al foco; y(x) de una onda en dos instantes; nivel sonoro frente a la intensidad. Malas gráficas: una recta sin más, o la misma curva repetida en tres gráficas.\n\n### FUNCION (solo en temas de análisis matemático)\n\n```\n{ \"id\": \"fun_racional_1\", \"tema\": \"Funciones\", \"nombre\": \"Racional con asíntota oblicua\", \"expresion\": \"(x^2+1)/(x-1)\", \"rango\": [-6, 8], \"nota\": \"Asíntota vertical en x = 1 y oblicua y = x + 1.\" }\n```\n\n- Úsalo cuando los apuntes sean de **estudio y representación de funciones, derivadas o límites**: cada función de ejemplo o de ejercicio se incluye aquí, y la app la analiza sola (dominio, cortes, signo, simetría, asíntotas, f′ y f″, monotonía, extremos, curvatura, inflexión y gráfica).\n- `expresion`: la fórmula de f(x) **sin el «f(x) =»**, con la sintaxis de ecuaciones, usando **solo la variable `x`** y números (nada de parámetros con letra: sustitúyelos por valores).\n- `rango`: `[mínimo, máximo]` de x que merece la pena ver (que entren las raíces, los extremos y las asíntotas).\n- `nota` (opcional): lo que hay que fijarse o el resultado que dan los apuntes, para comparar.\n- `formulas` (opcional): ids de fórmulas relacionadas (por ejemplo, la regla de derivación que se aplica).\n- No conviertas en FUNCION las fórmulas de Física: ahí lo que procede es una GRAFICA.\n\n### EJERCICIO\n\n```\n{\n  \"id\": \"ej_mas_muelle\", \"tema\": \"MAS\", \"titulo\": \"Muelle que oscila\", \"dificultad\": 2,\n  \"enunciado\": \"Un muelle de constante 200 N/m sostiene una masa de 0,5 kg que oscila con amplitud 0,03 m. Calcula el período y la velocidad máxima.\",\n  \"datos\": { \"K\": 200, \"m\": 0.5, \"A\": 0.03 },\n  \"pasos\": [\n    { \"texto\": \"El período de un muelle depende de la masa y de la constante:\", \"formula\": \"mas_periodo_muelle\", \"incognita\": \"T\" },\n    { \"texto\": \"Con el período sale la pulsación:\", \"formula\": \"mas_pulsacion\", \"incognita\": \"w\" },\n    { \"texto\": \"La velocidad es máxima al pasar por el equilibrio:\", \"formula\": \"mas_vmax\", \"incognita\": \"vmax\" }\n  ],\n  \"resultado\": \"T ≈ 0,31 s; v_max ≈ 0,19 m/s\",\n  \"nota\": \"Si la amplitud viene en cm, pásala a metros antes de sustituir.\"\n}\n```\n\n- La app **resuelve sola** cada paso: toma la fórmula, despeja la `incognita`, sustituye los valores conocidos (los `datos` más lo calculado en pasos anteriores y las constantes con `valor`) y da el número con su unidad. Por eso cada paso debe poder calcularse con lo que ya se sabe en ese momento: **ordena los pasos** de forma que lo que necesita cada uno esté antes.\n- `datos`: un número (sin comillas) por magnitud conocida, **en unidades S.I.** y con la clave del glosario. Si el enunciado da 3 cm, en `datos` va `0.03`. Los números del enunciado que coincidan con un dato se enlazan automáticamente.\n- Cada paso lleva `texto` (una frase de por qué se hace) y, o bien `formula` + `incognita` (clave que se despeja; debe aparecer **una sola vez** en esa fórmula), o bien `ecuacion` para un paso libre (cambio de unidades, razonamiento) con la sintaxis de los pasos. Un paso libre puede llevar `asigna`: `{ \"clave\": número }` para fijar valores que usarán los pasos siguientes. Si la fórmula tiene `variantes`, indica `\"variante\": índice`.\n- `resultado` (opcional): el resultado de los apuntes, para que el alumno compare. Si hay apartados, escríbelo también por apartados: `a) … b) …`. `dificultad`: 1, 2 o 3.\n- **Apartados**: si el ejercicio tiene varios, escríbelos dentro del `enunciado` como `a) … b) … c) …`, en orden; lo que va antes del `a)` es el planteamiento común. La app los separa sola y reparte los pasos entre ellos. Si un paso podría confundirse, indica a qué apartado pertenece con `\"apartado\": \"b\"`.\n- `pistas` (opcional): `{ \"a\": \"…\", \"b\": \"…\" }`, una pista corta por apartado que oriente sin dar el resultado. La app añade sola dos pistas más: qué hay que calcular y qué fórmulas sirven.\n- `nota` (opcional): pista general o trampa típica. La app la esconde hasta que el alumno la pide.\n- `grupos` (opcional): si el ejercicio no sale de una PAU pero viene de otra colección, lista con su nombre, por ejemplo `[\"Boletín 3 de tracción\"]`. La app agrupa por ese nombre: escríbelo igual en todos los ejercicios del mismo boletín.\n- `pau` (**obligatorio si el ejercicio procede de una PAU, EvAU, EBAU o selectividad**): de qué prueba ha salido, como un solo texto con todo lo que conste, en este orden: comunidad, año, convocatoria (`junio`, `julio`, `septiembre`, `modelo`), si es de `coincidentes` o `reserva`, y la opción o bloque. Ejemplo: `\"pau\": \"Madrid · 2025 · julio · coincidentes · opción B\"`. Escribe solo lo que figure en los apuntes: si falta algún dato, déjalo fuera y avísalo en `Dudas`; nunca lo deduzcas ni lo inventes. Si el ejercicio no es de una prueba de acceso, no pongas este campo.\n- `examen` (opcional): si los apuntes dicen que el ejercicio cayó en un examen concreto del alumno (no en una PAU), su nombre: `\"examen\": \"2.º parcial, noviembre 2026\"`. La app lo marca como caído en ese examen.\n\n### DIAGRAMA (solo si los apuntes tienen diagramas técnicos)\n\n```\n{\n  \"id\": \"dg_traccion\", \"tema\": \"Materiales\", \"titulo\": \"Ensayo de tracción de un acero dulce\",\n  \"ejeX\": { \"nombre\": \"Deformación unitaria ε\", \"unidad\": \"%\" }, \"ejeY\": { \"nombre\": \"Tensión σ\", \"unidad\": \"MPa\" },\n  \"rangoX\": [0, 30], \"rangoY\": [0, 550],\n  \"lineas\": [ { \"nombre\": \"Curva tensión-deformación\", \"curva\": true, \"puntos\": [[0,0],[0.2,420],[1.5,420],[12,520],[22,470],[25,430]], \"texto\": \"Cada punto es (ε, σ) durante el ensayo.\" } ],\n  \"zonas\": [\n    { \"nombre\": \"Zona elástica\", \"x\": [0, 0.2], \"texto\": \"Recta: σ = E·ε (ley de Hooke). Si se retira la carga, la probeta recupera su longitud.\", \"formulas\": [\"mat_hooke\"] },\n    { \"nombre\": \"Fluencia\", \"x\": [0.2, 1.5], \"texto\": \"La deformación crece sin aumentar la tensión.\" },\n    { \"nombre\": \"Endurecimiento\", \"x\": [1.5, 12], \"texto\": \"Hace falta más tensión para seguir deformando.\" },\n    { \"nombre\": \"Estricción y rotura\", \"x\": [12, 25], \"texto\": \"La sección se reduce localmente hasta la rotura.\" }\n  ],\n  \"puntos\": [ { \"nombre\": \"Límite elástico\", \"x\": 0.2, \"y\": 420, \"texto\": \"Tensión máxima sin deformación permanente.\" }, { \"nombre\": \"Resistencia a la tracción\", \"x\": 12, \"y\": 520, \"texto\": \"Tensión máxima del ensayo.\" } ],\n  \"calculos\": [ { \"nombre\": \"Módulo de Young\", \"texto\": \"Pendiente de la zona elástica: E = Δσ/Δε. Usa «Medir pendiente» con dos puntos de la recta inicial.\", \"formula\": \"mat_hooke\" } ],\n  \"formulas\": [\"mat_hooke\"],\n  \"nota\": \"Valores orientativos de un acero dulce.\"\n}\n```\n\n- Las coordenadas van en las unidades de los ejes. Las **zonas** se dan como banda `\"x\": [desde, hasta]` o como `\"poligono\": [[x,y], …]` (tres puntos o más; por ejemplo las regiones de fases del diagrama hierro-carbono, con %C en el eje X y temperatura en °C en el eje Y). Las **lineas** son poligonales (`\"curva\": true` las suaviza; `\"estilo\": \"discontinua\"` para líneas auxiliares). Los **puntos** señalan valores singulares (eutectoide, eutéctico, límite elástico…).\n- Cada zona, línea y punto lleva `texto` con la explicación que verá el alumno al pasar el cursor, y puede llevar `formulas` (ids) con las fórmulas que se aplican ahí.\n- `calculos`: qué se obtiene del diagrama y cómo (módulo de Young, porcentaje de fases por la regla de la palanca, rendimiento de un ciclo…), con la fórmula del catálogo si existe.\n- Sé fiel a los apuntes en formas y valores; si los apuntes no dan números, usa valores orientativos realistas y dilo en `nota`.\n\n## Sintaxis de las ecuaciones (la parte más importante)\n\nLa app tiene un lector de ecuaciones propio. Solo entiende esto:\n\n| Escribe | Significa | Ejemplo |\n|---|---|---|\n| `+ - * /` | suma, resta, producto, cociente | `m*a`, `P/(4*pi*R^2)` |\n| `^` | potencia | `w^2`, `R2^2`, `10^(beta/10)` |\n| `( )` | agrupar | `(V+vO)/(V-vF)` |\n| `pi` | π | `2*pi*f` |\n| números | con punto decimal | `0.5`, `10`, `1/2` |\n| `sin cos tan asin acos atan` | trigonométricas (también `sen`, `tg`) | `sin(w*t+phi)` |\n| `log` | logaritmo **decimal** | `10*log(I/I0)` |\n| `ln`, `exp`, `sqrt` | neperiano, eᵡ, raíz cuadrada | `exp(-alpha*xe)`, `sqrt(K/m)` |\n| claves de magnitudes | las variables | `vF`, `lam`, `Ec` |\n| `\"texto\"` | texto libre que se dibuja tal cual (solo en pasos) | `\"dx\"/\"dt\"` |\n| `[ ... ]` | resaltar (solo en pasos) | `m*[-w^2*x]` |\n| `=` `~` `∝` | igual, aproximadamente, proporcional (cadenas solo en pasos) | `F ~ -m*g*[x/l]` |\n\nReglas que **no admiten excepción**:\n\n1. **Producto siempre explícito con `*`.** Bien: `2*pi*f`, `A*w*cos(w*t)`. Mal: `2pi f`, `Aω`, `2(x+1)`.\n2. **Funciones siempre con paréntesis.** Bien: `sin(theta)`, `sqrt(l/g)`. Mal: `sin theta`, `√x`.\n3. **El signo menos** solo va al principio de una expresión o detrás de `(`. Bien: `-w^2*x`, `a*(-b)`, `exp(-alpha*xe)`. Mal: `a*-b`, `10^-12`. Escribe `10^(-12)`.\n4. **Exponentes compuestos entre paréntesis.** Bien: `10^(beta/10)`, `e^x`, que se escribe `exp(x)`. Mal: `10^beta/10`, que significaría (10^β)/10.\n5. **Nada de notación 1e-12 dentro de ecuaciones**; usa `10^(-12)`. (En `valor` de una magnitud sí se usa `1e-12`.)\n6. **Solo claves declaradas.** Cada identificador de una ecuación debe ser una clave de `magnitudes` (de este paquete o del catálogo), una función de la tabla o `pi`. Una letra suelta sin declarar es un error.\n7. **Sin símbolos Unicode dentro de ecuaciones** (ω, √, ², ·, ×, −). Van en `simbolo`, `texto` y `nota`, nunca en `ecuacion`.\n8. **Para que se pueda despejar**, intenta que cada magnitud aparezca **una sola vez** en la `ecuacion` de la fórmula. La app solo ofrece despejar las que aparecen una vez. Si es inevitable que salga dos veces, se acepta.\n9. Las fracciones ½ se escriben `1/2*K*A^2`, y la app las dibuja apiladas.\n\n## Criterios de calidad\n\n- **Fidelidad**: todo lo que está en los apuntes debe aparecer. Si añades algo que no está (una deducida habitual en ejercicios, por ejemplo), indícalo en `Dudas`.\n- **Primas de verdad**: con las primas de un tema, y como mucho las de otros temas, se debe poder llegar a todas las deducidas siguiendo `deDonde`. Si una deducida no se puede alcanzar, o falta una prima o falta un paso.\n- **Unidades S.I.** coherentes en todas las magnitudes. Ángulos en radianes.\n- **Notación**: respeta la notación de los apuntes en los símbolos, pero con claves distintas cuando el significado cambie.\n- **Pasos útiles**: que un alumno entienda de dónde sale cada cosa sin el libro. No te saltes el paso clave ni lo rellenes de pasos triviales.\n- **Notas de examen**: trampas típicas (ángulo doble del arcsen, signos según sentido, unidades), cuándo NO se puede aplicar y casos particulares.\n- **Idioma**: español de España.\n\n## Autoverificación (hazla antes de responder)\n\nRepasa uno por uno y corrige lo que falle:\n\n- [ ] El JSON es válido: comillas dobles, sin comas finales, sin comentarios. `formato` es `\"formulario-v1\"`.\n- [ ] Cada fórmula tiene `id` único, `tema` existente, `tipo`, `nombre`, `ecuacion` con un solo `=`, `nota` y `pasos`.\n- [ ] Cada identificador de cada ecuación (fórmulas, variantes y pasos) es una clave declarada o del catálogo, una función de la tabla o `pi`.\n- [ ] Ninguna ecuación tiene producto implícito, Unicode, `^-` ni `1e-…`.\n- [ ] Todos los ids de `deDonde` y `usa` existen (en el paquete o en el catálogo).\n- [ ] El último paso de cada fórmula termina en su `ecuacion` exacta (o en `\"@\"` si tiene variantes).\n- [ ] Cada magnitud tiene `simbolo`, `nombre` y `unidad` S.I.; las constantes llevan `valor`.\n- [ ] Cada gráfica tiene `x` declarada, `rango` numérico, `series` con la clave sola a la izquierda del `=`, un número en `valores` para cada magnitud restante y al menos un id en `formulas`.\n- [ ] Cada función tiene `expresion` sin «=» y solo con la variable `x`, y un `rango` numérico.\n- [ ] Cada ejercicio que proceda de una PAU, EvAU, EBAU o selectividad lleva `pau` con lo que conste de esa prueba.\n- [ ] En cada ejercicio, los `datos` están en S.I., cada paso con `formula` tiene una `incognita` que aparece una sola vez en ella, y los pasos están ordenados para que cada uno se pueda calcular con lo anterior.\n- [ ] Cada diagrama tiene `ejeX`, `ejeY`, `rangoX`, `rangoY` y al menos una zona o línea, todo con `texto`.\n- [ ] No hay dos claves con el mismo significado, ni una clave con dos significados.\n- [ ] Cada tema tiene entre 3 y 7 primas, y todas las deducidas se alcanzan desde ellas.\n- [ ] Una sola línea de resumen, un solo bloque `json` y, si hace falta, `Dudas:`.\n\n## Ejemplo completo y válido\n\nEste es un paquete mínimo correcto (fíjate en el estilo, no copies su contenido):\n\n```json\n{\n  \"formato\": \"formulario-v1\",\n  \"titulo\": \"Ejemplo · MAS (extracto)\",\n  \"temas\": [ { \"id\": \"MAS\", \"nombre\": \"Movimiento armónico simple\", \"materia\": \"Física\" } ],\n  \"magnitudes\": {\n    \"w\": { \"simbolo\": \"ω\", \"nombre\": \"Pulsación o frecuencia angular\", \"unidad\": \"rad/s\", \"nota\": \"Dimensionalmente equivale a s⁻¹.\" },\n    \"T\": { \"simbolo\": \"T\", \"nombre\": \"Período (tiempo de una oscilación completa)\", \"unidad\": \"s\" },\n    \"f\": { \"simbolo\": \"f\", \"nombre\": \"Frecuencia (oscilaciones por segundo)\", \"unidad\": \"Hz\", \"nota\": \"1 Hz = 1 s⁻¹.\" },\n    \"K\": { \"simbolo\": \"K\", \"nombre\": \"Constante recuperadora (elástica) del muelle\", \"unidad\": \"N/m\", \"nota\": \"Equivale a kg/s². En mayúscula para no confundirla con el número de onda k.\" },\n    \"m\": { \"simbolo\": \"m\", \"nombre\": \"Masa\", \"unidad\": \"kg\" },\n    \"F\": { \"simbolo\": \"F\", \"nombre\": \"Fuerza recuperadora\", \"unidad\": \"N\" },\n    \"x\": { \"simbolo\": \"x\", \"nombre\": \"Elongación (posición respecto al equilibrio)\", \"unidad\": \"m\" },\n    \"a\": { \"simbolo\": \"a\", \"nombre\": \"Aceleración de la partícula que oscila\", \"unidad\": \"m/s²\" }\n  },\n  \"formulas\": [\n    {\n      \"id\": \"mas_pulsacion\", \"tema\": \"MAS\", \"tipo\": \"prima\", \"nombre\": \"Pulsación y período\",\n      \"ecuacion\": \"w = 2*pi/T\",\n      \"nota\": \"Como f = 1/T, también ω = 2πf.\",\n      \"pasos\": [\n        { \"texto\": \"En una oscilación completa la fase avanza una vuelta, 2π rad, y eso tarda un período T.\", \"ecuacion\": \"w*T = 2*pi\" },\n        { \"texto\": \"Como la frecuencia es el inverso del período:\", \"ecuacion\": \"w = 2*pi*[f]\" },\n        { \"texto\": \"Despejando ω queda la relación con el período:\", \"ecuacion\": \"w = 2*pi/T\" }\n      ]\n    },\n    {\n      \"id\": \"mas_dinamica\", \"tema\": \"MAS\", \"tipo\": \"prima\", \"nombre\": \"Dinámica del MAS\",\n      \"ecuacion\": \"K = m*w^2\",\n      \"nota\": \"Es el puente entre lo dinámico (K, m) y lo cinemático (ω).\",\n      \"pasos\": [\n        { \"texto\": \"Ley de Hooke: la fuerza recuperadora es proporcional al desplazamiento y de sentido contrario.\", \"ecuacion\": \"F = -K*x\" },\n        { \"texto\": \"Segunda ley de Newton, con la aceleración del MAS a = −ω²x:\", \"ecuacion\": \"F = m*a = m*[-w^2*x]\" },\n        { \"texto\": \"Igualando y simplificando −x:\", \"ecuacion\": \"K = m*w^2\" }\n      ]\n    },\n    {\n      \"id\": \"mas_periodo_muelle\", \"tema\": \"MAS\", \"tipo\": \"deducida\", \"nombre\": \"Período de un muelle\",\n      \"ecuacion\": \"T = 2*pi*sqrt(m/K)\",\n      \"nota\": \"Depende de la masa porque la fuerza recuperadora es elástica.\",\n      \"deDonde\": [\"mas_pulsacion\", \"mas_dinamica\"],\n      \"pasos\": [\n        { \"texto\": \"De la dinámica del MAS despejamos ω:\", \"ecuacion\": \"w = sqrt(K/m)\", \"usa\": [\"mas_dinamica\"] },\n        { \"texto\": \"Sustituimos en T = 2π/ω:\", \"ecuacion\": \"T = 2*pi/w = 2*pi/[sqrt(K/m)]\", \"usa\": [\"mas_pulsacion\"] },\n        { \"texto\": \"Dividir entre √(K/m) es multiplicar por √(m/K):\", \"ecuacion\": \"T = 2*pi*sqrt(m/K)\" }\n      ]\n    }\n  ],\n  \"graficas\": [\n    {\n      \"id\": \"mas_a_frente_x\", \"tema\": \"MAS\", \"titulo\": \"Aceleración frente a elongación\",\n      \"x\": \"x\", \"rango\": [-0.1, 0.1],\n      \"series\": [ { \"nombre\": \"a(x)\", \"ecuacion\": \"a = -w^2*x\" } ],\n      \"valores\": { \"w\": 6.28 },\n      \"formulas\": [\"mas_dinamica\"],\n      \"nota\": \"Recta de pendiente −ω²: la aceleración siempre apunta hacia el equilibrio y crece con la elongación.\"\n    }\n  ]\n}\n```\n\n## Catálogo actual de la app\n\nLo que ya tengo en la app. Reutiliza estos `id` de temas, claves de magnitudes y `id` de fórmulas cuando correspondan (en `tema`, en las ecuaciones, en `deDonde`, en `usa` y en `formulas` de las gráficas). No los vuelvas a declarar.\n\n{{CATALOGO}}\n\n---\n\nCuando estés listo, te paso los apuntes. Responde **solo** con el formato indicado.\n";     // prompt para la IA; {{CATALOGO}} se sustituye por lo que hay en la app

/* ============ 2. LECTOR DE ECUACIONES ============ */
// Funciones admitidas: nombre interno → cómo se escribe. Alias en español aceptados al leer.
const FUN = {sin:'sen',cos:'cos',tan:'tg',asin:'arcsen',acos:'arccos',atan:'arctg',log:'log',ln:'ln',exp:'exp',sqrt:'sqrt'};
const ALIAS = {sen:'sin',tg:'tan',arcsen:'asin',arccos:'acos',arctg:'atan'};
const RESERVED = new Set([...Object.keys(FUN),...Object.keys(ALIAS),'pi']);
const TOKRE = /"[^"]*"|\d+(?:\.\d+)?|[A-Za-z_]\w*|[-+*/^()\[\]]/g;

// Lee un lado de una ecuación y devuelve un árbol. Lanza un Error con mensaje en español si algo no cuadra.
function parseSide(src){
  const s=String(src).trim();
  if(!s) throw new Error('hay un lado vacío');
  const toks=s.match(TOKRE)||[];
  // comprueba que no haya caracteres sueltos que el lector no entiende
  const rest=s.replace(TOKRE,'').replace(/\s+/g,'');
  if(rest) throw new Error(`carácter no válido: «${rest[0]}»`+(/[·×−√²³πωλ]/.test(rest[0])?' (escribe *, -, sqrt(), ^2, pi o la clave de la magnitud)':''));
  let i=0; const peek=()=>toks[i], next=()=>toks[i++];
  const expect=t=>{ if(next()!==t) throw new Error(`falta «${t}»`); };
  function expr(){ let n; if(peek()==='-'){next(); n={op:'neg',a:term()};} else n=term();
    while(peek()==='+'||peek()==='-'){const o=next(); n={op:o==='+'?'add':'sub',a:n,b:term()};} return n; }
  function term(){ let n=power(); while(peek()==='*'||peek()==='/'){const o=next(); n={op:o==='*'?'mul':'div',a:n,b:power()};} return n; }
  function power(){ const b=primary(); if(peek()==='^'){next(); if(peek()==='-') throw new Error('exponente negativo sin paréntesis: escribe ^(-n)'); return {op:'pow',a:b,b:primary()};} return b; }
  function primary(){ const t=next();
    if(t===undefined) throw new Error('la expresión termina antes de tiempo');
    if(t==='('){const e=expr(); expect(')'); return e;}
    if(t==='['){const e=expr(); expect(']'); return {op:'hl',a:e};}
    if(t[0]==='"') return {op:'txt',h:t.slice(1,-1)};
    if(/^\d/.test(t)){ if(peek()&&/^[A-Za-z_(]/.test(peek())) throw new Error(`falta «*» después de ${t}`); return {op:'num',v:parseFloat(t)}; }
    if(t==='pi') return {op:'pi'};
    const fn=ALIAS[t]||t;
    if(FUN[fn]){ if(peek()!=='(') throw new Error(`la función ${t} necesita paréntesis: ${t}(…)`); next(); const e=expr(); expect(')'); return {op:fn,a:e}; }
    if(/^[A-Za-z_]/.test(t)){ if(peek()==='(') throw new Error(`falta «*» entre ${t} y «(»`); return {op:'var',k:t}; }
    throw new Error(`símbolo inesperado: «${t}»`);
  }
  const tree=expr();
  if(i<toks.length) throw new Error(`sobra «${toks[i]}»`+(/^[A-Za-z_\d(]/.test(toks[i])?' (¿falta un «*»?)':''));
  return tree;
}
function parseEq(s){ const parts=String(s).split('='); if(parts.length!==2) throw new Error('debe tener exactamente un signo «=»'); return {L:parseSide(parts[0]),R:parseSide(parts[1])}; }

// Utilidades sobre el árbol
const N=(op,a,b)=>({op,a,b});
function has(n,k){ if(!n) return false; if(n.op==='var') return n.k===k; return has(n.a,k)||has(n.b,k); }
function vlist(n,out=[]){ if(!n) return out; if(n.op==='var'){ if(!out.includes(n.k)) out.push(n.k); return out;} vlist(n.a,out); vlist(n.b,out); return out; }
function count(n,k){ if(!n) return 0; if(n.op==='var') return n.k===k?1:0; return count(n.a,k)+count(n.b,k); }
const clone=n=>JSON.parse(JSON.stringify(n));
const isAtom=n=>['num','pi','var'].includes(n.op)||(n.op==='pow'&&['num','pi','var'].includes(n.a.op));
// identificadores de una ecuación (sin textos entre comillas ni funciones)
function idents(src){ const out=[]; (String(src).replace(/"[^"]*"/g,' ').match(/[A-Za-z_]\w*/g)||[]).forEach(t=>{ if(!RESERVED.has(t)&&!out.includes(t)) out.push(t); }); return out; }

// Simplificador: deja el resultado como se escribiría a mano (conserva las marcas de resaltado)
function simp(n){
  if(!n||!n.op) return n;
  if(n.a) n.a=simp(n.a); if(n.b) n.b=simp(n.b);
  const keep=r=>{ if(n.mv!==undefined&&r.mv===undefined) r.mv=n.mv; return r; };
  const {op,a,b}=n;
  if(op==='div'){
    if(b.op==='num'&&b.v===1) return keep(a);
    if(b.op==='div') return keep(simp(N('div', isAtom(b.b)&&!isAtom(a)?N('mul',b.b,a):N('mul',a,b.b), b.a)));
    if(a.op==='div') return keep(simp(N('div',a.a,N('mul',b,a.b))));
    if(b.op==='mul'&&b.a.op==='div'&&b.a.a.op==='num'&&b.a.a.v===1) return keep(simp(N('div',N('mul',b.a.b,a),b.b)));
  }
  if(op==='pow'&&b.op==='num'){
    if(a.op==='num') return keep({op:'num',v:Math.pow(a.v,b.v)});
    if(a.op==='div') return keep(simp(N('div',N('pow',a.a,{...b}),N('pow',a.b,{...b}))));
    if(a.op==='mul') return keep(simp(N('mul',N('pow',a.a,{...b}),N('pow',a.b,{...b}))));
  }
  if(op==='neg'&&a.op==='neg') return keep(a.a);
  return n;
}

// Despeje paso a paso: aplica la operación inversa a la que envuelve la incógnita.
// .out = paso en que el término sale; .mv = paso en que llega (para resaltarlo).
const INV={sin:'asin',cos:'acos',tan:'atan'};
function solve(L0,R0,k){
  let L=clone(L0), R=clone(R0);
  const steps=[{L,R,cap:{t:'orig'}}];
  if(L.op==='var'&&L.k===k){ steps[0].cap={t:'ya'}; return steps; }
  if(!has(L,k)){ [L,R]=[R,L]; steps.push({L,R,cap:{t:'swap'}}); }
  for(let g=0; g<40 && !(L.op==='var'&&L.k===k); g++){
    const s=steps.length, A=L.a, B=L.b, inA=has(A,k);
    const mark=n=>{n.out=s; n.mv=s;};
    let nL,nR,cap;
    switch(L.op){
      case 'add':{ const m=inA?B:A; mark(m); nL=inA?A:B; nR=N('sub',R,m); cap={t:'restando',x:m}; break; }
      case 'sub': if(inA){ mark(B); nL=A; nR=N('add',R,B); cap={t:'sumando',x:B}; } else { mark(R); nL=B; nR=N('sub',A,R); cap={t:'swapsub',x:B,y:R}; } break;
      case 'mul':{ const m=inA?B:A; mark(m); nL=inA?A:B; nR=N('div',R,m); cap={t:'dividiendo',x:m}; break; }
      case 'div': if(inA){ mark(B); nL=A; nR=isAtom(B)?N('mul',B,R):N('mul',R,B); cap={t:'multiplicando',x:B}; } else { mark(R); nL=B; nR=N('div',A,R); cap={t:'swapdiv',x:B,y:R}; } break;
      case 'pow': if(!inA) return steps; L.out=s; nL=A;
                  if(B.op==='num'&&B.v===2){ nR={op:'sqrt',a:R}; cap={t:'raiz'}; } else { nR=N('pow',R,N('div',{op:'num',v:1},B)); cap={t:'raizn'}; }
                  nR.mv=s; break;
      case 'sqrt': L.out=s; nL=A; nR=N('pow',R,{op:'num',v:2}); nR.mv=s; cap={t:'cuadrado'}; break;
      case 'sin': case 'cos': case 'tan': L.out=s; nL=A; nR={op:INV[L.op],a:R}; nR.mv=s; cap={t:L.op}; break;
      case 'log': L.out=s; nL=A; nR=N('pow',{op:'num',v:10},R); nR.mv=s; cap={t:'log'}; break;
      case 'ln':  L.out=s; nL=A; nR={op:'exp',a:R}; nR.mv=s; cap={t:'ln'}; break;
      case 'exp': L.out=s; nL=A; nR={op:'ln',a:R}; nR.mv=s; cap={t:'exp'}; break;
      case 'neg': L.out=s; nL=A; nR={op:'neg',a:R}; nR.mv=s; cap={t:'neg'}; break;
      default: return steps;
    }
    nR=simp(nR); steps.push({L:nL,R:nR,cap}); L=nL; R=nR;
  }
  return steps;
}
// Evaluación numérica para la calculadora
function ev(n,V){ switch(n.op){
  case 'num':return n.v; case 'pi':return Math.PI; case 'var':return V[n.k];
  case 'add':return ev(n.a,V)+ev(n.b,V); case 'sub':return ev(n.a,V)-ev(n.b,V);
  case 'mul':return ev(n.a,V)*ev(n.b,V); case 'div':return ev(n.a,V)/ev(n.b,V);
  case 'pow':return Math.pow(ev(n.a,V),ev(n.b,V)); case 'neg':return -ev(n.a,V);
  case 'sqrt':return Math.sqrt(ev(n.a,V)); case 'sin':return Math.sin(ev(n.a,V)); case 'cos':return Math.cos(ev(n.a,V)); case 'tan':return Math.tan(ev(n.a,V));
  case 'asin':return Math.asin(ev(n.a,V)); case 'acos':return Math.acos(ev(n.a,V)); case 'atan':return Math.atan(ev(n.a,V));
  case 'log':return Math.log10(ev(n.a,V)); case 'ln':return Math.log(ev(n.a,V)); case 'exp':return Math.exp(ev(n.a,V));
  default: return NaN;
}}

/* ============ 3. DIBUJO ============ */
const esc=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
// marcado ligero: _{sub}, ^{sup}; en símbolos también _x y ^x de un carácter
const mk=h=>h.replace(/_\{([^}]*)\}/g,'<sub>$1</sub>').replace(/\^\{([^}]*)\}/g,'<sup>$1</sup>');
const symH=s=>mk(esc(s)).replace(/_([^\s{<&])/g,'<sub>$1</sub>').replace(/\^([^\s{<&])/g,'<sup>$1</sup>');
const strip=s=>String(s??'').replace(/[_^]\{([^}]*)\}/g,'$1').replace(/[_^](.)/g,'$1');
let PLAIN=false, HLK=null, FNMODE=false;   // FNMODE: dibujar variables tal cual (funciones f(x)), sin buscarlas en el glosario
const prec=n=>n.op==='hl'?prec(n.a):({add:1,sub:1,neg:1.5,mul:2,div:3,pow:4}[n.op]??5);
const isNumLead=n=>n.op==='num'||((n.op==='mul'||n.op==='pow'||n.op==='hl')&&isNumLead(n.a));
function varH(k){
  if(FNMODE) return `<span class="v">${esc(k)}</span>`;
  const m=MAG[k];
  if(!m) return `<span class="v bad" title="Magnitud sin definir">${esc(k)}</span>`;
  return PLAIN?`<span class="v">${symH(m.simbolo)}</span>`:`<span class="v" data-k="${esc(k)}" tabindex="0" role="button" aria-label="${esc(m.nombre)}">${symH(m.simbolo)}</span>`;
}
function par(h){ const t=h.includes('class="fr"')||h.includes('sq tall'); return t?`<span class="pg"><span class="pa tall">(</span>${h}<span class="pa tall">)</span></span>`:`<span class="pa">(</span>${h}<span class="pa">)</span>`; }
const fmtN=v=>String(v).replace('.',',');
const pwH=(a,e)=>`<span class="pw${a.includes('class="fr"')||a.includes('sq tall')?' tall':''}">${a}<sup>${e}</sup></span>`;
function rd(n,j){
  const inn=n.mv!==undefined&&n.mv===j, out=!inn&&n.out!==undefined&&n.out===j+1;
  const cls=inn?'hl hin':(out?'hl hout':'');
  const W=s=>cls?`<span class="${cls}">${s}</span>`:s;
  const Wp=(head,rest)=>out?`<span class="${cls}">${head}</span>${rest}`:W(head+rest);
  switch(n.op){
    case 'num': { if(n.k===undefined) return W(`<span class="n">${fmtN(n.v)}</span>`);   // número que sustituye a una magnitud: lleva su información
      const t=fmtV(Math.abs(n.v))??'—', inner=`<span class="v nv" data-k="${esc(n.k)}" data-val="${esc(n.v)}" data-src="${esc(n.src||'')}" tabindex="0">${n.v<0?'−':''}${t}</span>`; return W(n.v<0?par(inner):inner); }
    case 'pi':  return W('<span class="n">π</span>');
    case 'txt': return `<span class="tx">${symH(n.h)}</span>`;
    case 'hl':  return `<span class="hl hin">${rd(n.a,j)}</span>`;
    case 'var': { const h=varH(n.k); return W(HLK===n.k?`<span class="hl hin">${h}</span>`:h); }
    case 'add': return W(rd(n.a,j)+'<span class="op">+</span>'+(n.b.op==='neg'?par(rd(n.b,j)):rd(n.b,j)));
    case 'sub': return W(rd(n.a,j)+'<span class="op">−</span>'+(prec(n.b)<2?par(rd(n.b,j)):rd(n.b,j)));
    case 'mul': { let a=rd(n.a,j), b=rd(n.b,j); if(prec(n.a)<2) a=par(a); if(prec(n.b)<2) b=par(b);
                  return W(a+(isNumLead(n.b)?'<span class="op dot">·</span>':'<span class="jx"></span>')+b); }
    case 'div': return W(`<span class="fr"><span class="nu">${rd(n.a,j)}</span><span class="de">${rd(n.b,j)}</span></span>`);
    case 'pow': { let a=rd(n.a,j); if(prec(n.a)<5||n.a.op==='sqrt') a=par(a); return out?pwH(a,`<span class="${cls}">${rd(n.b,j)}</span>`):W(pwH(a,rd(n.b,j))); }
    case 'neg': { let a=rd(n.a,j); if(prec(n.a)<=1.5) a=par(a); return Wp('<span class="n">−</span>',a); }
    case 'sqrt':{ const inner=rd(n.a,j); return W(`<span class="sq${inner.includes('class="fr"')?' tall':''}"><span class="rad">√</span><span class="sqb">${inner}</span></span>`); }
    case 'exp': { const e='<span class="n">e</span>'; return out?pwH(`<span class="${cls}">${e}</span>`,rd(n.a,j)):W(pwH(e,rd(n.a,j))); }
    default:    return Wp(`<span class="fn">${FUN[n.op]||esc(n.op)}</span>`,par(rd(n.a,j)));

}
const eqH=(L,R,j)=>`<span class="eq">${rd(L,j)}<span class="eqs">=</span>${rd(R,j)}</span>`;
// Ecuación de una deducción: admite cadenas a = b = c, ≈ (escrito ~) y ∝; '@' = la fórmula (variante elegida)
function chainH(s,f){
  if(s==='@'&&f){ const e=getEq(f); return e?eqH(e.L,e.R,-99):''; }
  const parts=String(s).split(/(=|~|∝)/); let h='';
  parts.forEach((p,i)=>{ h+= i%2 ? `<span class="eqs">${p==='~'?'≈':p}</span>` : rd(parseSide(p),-99); });
  return `<span class="eq">${h}</span>`;
}
function chainSafe(s,f){ try{ return chainH(s,f); }catch(e){ return `<span class="perr">No se puede leer «${esc(s)}»: ${esc(e.message)}</span>`; } }
// Texto enriquecido: escapa todo y solo permite **negrita**, _{sub}, ^{sup} y fórmulas cortas entre $…$
function RT(s){
  if(!s) return '';
  return String(s).split(/(\$[^$]+\$)/g).map(p=>{
    if(p.length>2&&p[0]==='$'&&p[p.length-1]==='$'){ try{ return `<span class="mi">${chainH(p.slice(1,-1))}</span>`; }catch(e){ return esc(p); } }
    return mk(esc(p)).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  }).join('');
}
const termH=n=>{ const o=PLAIN; PLAIN=true; const h=rd(n,-99); PLAIN=o; return `<span class="m">${h}</span>`; };
// Texto que explica cada paso del despeje
function capH(c){ switch(c.t){
  case 'orig': return 'Partimos de la fórmula.';
  case 'ya': return 'Esta incógnita ya está despejada: es la forma en que se suele memorizar.';
  case 'swap': return 'Damos la vuelta a la igualdad para tener la incógnita a la izquierda.';
  case 'restando': return `${termH(c.x)} está sumando → pasa al otro lado <b>restando</b>.`;
  case 'sumando': return `${termH(c.x)} está restando → pasa al otro lado <b>sumando</b>.`;
  case 'dividiendo': return `${termH(c.x)} está multiplicando → pasa al otro lado <b>dividiendo</b>.`;
  case 'multiplicando': return `${termH(c.x)} está dividiendo → pasa al otro lado <b>multiplicando</b>.`;
  case 'swapsub': return `La incógnita está restando: la pasamos a la izquierda sumando y ${termH(c.y)} pasa a la derecha <b>restando</b>.`;
  case 'swapdiv': return `La incógnita está en el denominador: sube multiplicando y ${termH(c.y)} pasa al otro lado <b>dividiendo</b>.`;
  case 'raiz': return 'Está al cuadrado → hacemos la <b>raíz cuadrada</b> en los dos miembros. Tomamos la raíz positiva (magnitud física); en rigor sería ±.';
  case 'raizn': return 'Está elevada a una potencia → hacemos la <b>raíz</b> correspondiente en los dos miembros.';
  case 'cuadrado': return 'Está dentro de una raíz → <b>elevamos al cuadrado</b> los dos miembros.';
  case 'sin': return 'Está dentro de un seno → aplicamos <b>arcsen</b> a los dos miembros (radianes). <b>Ojo:</b> α y π − α tienen el mismo seno; elige con el signo de la velocidad (la derivada).';
  case 'cos': return 'Está dentro de un coseno → aplicamos <b>arccos</b> a los dos miembros (radianes). <b>Ojo:</b> α y −α tienen el mismo coseno.';
  case 'tan': return 'Está dentro de una tangente → aplicamos <b>arctg</b> a los dos miembros. <b>Ojo:</b> α y α + π tienen la misma tangente.';
  case 'log': return 'Está dentro de un logaritmo decimal → hacemos <b>10 elevado a</b> cada miembro, porque 10<sup>log a</sup> = a.';
  case 'ln': return 'Está dentro de un ln → hacemos <b>e elevado a</b> cada miembro.';
  case 'exp': return 'Está en el exponente de e → tomamos <b>ln</b> en los dos miembros, porque ln(e<sup>a</sup>) = a.';
  case 'neg': return 'Tiene un signo menos delante → <b>cambiamos el signo</b> de los dos miembros.';

/* ============ 4. ALMACÉN ============
   Lo que ves = biblioteca (LIB, leída del archivo de datos) + cambios pendientes (USER).
   USER = { temas:{id:tema|{borrado}}, magnitudes:{k:mag|{borrada}}, formulas/graficas/funciones/ejercicios/diagramas:{id:x|{borrada}},
            mine:[ids]|null (null = igual que la biblioteca), colores:{materia:paleta} }
   Al guardar, los cambios se «consolidan» en LIB (commit) y LIB se escribe entera en el archivo.
   Cada elemento lleva «mod» (milisegundos de su último cambio) y los borrados dejan una marca en LIB.borrados,
   para poder juntar dos copias de la misma biblioteca (otro ordenador, una carpeta sincronizada o, en el futuro, Google Drive). */
const COLS=['formulas','graficas','funciones','ejercicios','diagramas'];
function emptyLib(){ return {formato:'formulario-v2',app:'Formulario',id:'',titulo:'',creado:'',modificado:'',temas:[],magnitudes:{},formulas:[],graficas:[],funciones:[],ejercicios:[],diagramas:[],mine:[],mineMod:0,colores:{},coloresMod:0,progreso:{},borrados:{}}; }
function emptyUser(){ return {temas:{},magnitudes:{},formulas:{},mine:null,colores:{},graficas:{},funciones:{},ejercicios:{},diagramas:{},progreso:{}}; }
const newLibId=()=>'lib_'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
let USER=emptyUser();
let TEMAS=[], MAG={}, F=[], byId={}, MINE=new Set(), GR=[], FN=[], EJ=[], DG=[], COLORES={}, PROG={}, ALL={temas:[],F:[],GR:[],FN:[],EJ:[],DG:[]}, HID=new Set();
// une una lista de la biblioteca con los cambios pendientes (respeta el orden de la biblioteca; lo nuevo, al final)
function mergeCol(base,over){ const m=new Map(); (base||[]).forEach(x=>{ if(x&&x.id) m.set(x.id,x); });
  Object.entries(over||{}).sort((a,b)=>(a[1].creado||0)-(b[1].creado||0)).forEach(([id,x])=>{ if(!x||x.borrada) m.delete(id); else m.set(id,x.id?x:{...x,id}); });
  return [...m.values()]; }
const now=()=>Date.now();
function rebuild(){
  const base=LIB||emptyLib();
  // temas: los del paquete en su orden y después los creados por el usuario
  const tm=new Map(); base.temas.forEach(t=>tm.set(t.id,{...t}));
  Object.entries(USER.temas).sort((a,b)=>(a[1].orden||0)-(b[1].orden||0)).forEach(([id,t])=>{ if(t.borrado) tm.delete(id); else tm.set(id,{...(tm.get(id)||{}),...t,id}); });
  ALL.temas=[...tm.values()]; HID=new Set(ALL.temas.filter(t=>t.oculto).map(t=>t.id)); TEMAS=ALL.temas.filter(t=>!t.oculto);
  const vis=xs=>xs.filter(x=>!HID.has(x.tema));
  MAG={...base.magnitudes};
  Object.entries(USER.magnitudes).forEach(([k,m])=>{ if(m.borrada) delete MAG[k]; else MAG[k]=m; });
  ALL.F=mergeCol(base.formulas,USER.formulas); F=vis(ALL.F);
  byId=Object.fromEntries(ALL.F.map(f=>[f.id,f]));   // completo: un ejercicio visible puede seguir usando una fórmula de un tema oculto
  MINE=new Set((USER.mine!=null?USER.mine:(base.mine||[])).filter(id=>byId[id]));
  COLORES={...(base.colores||{}),...(USER.colores||{})};
  ALL.GR=mergeCol(base.graficas,USER.graficas); GR=vis(ALL.GR);
  ALL.FN=mergeCol(base.funciones,USER.funciones); FN=vis(ALL.FN);
  ALL.EJ=mergeCol(base.ejercicios,USER.ejercicios); EJ=vis(ALL.EJ);
  ALL.DG=mergeCol(base.diagramas,USER.diagramas); DG=vis(ALL.DG);
  PROG={...(base.progreso||{}),...(USER.progreso||{})};
  OCC=null; OCC2=null; EQC={}; FOR={}; EJFC=new WeakMap();
  renderMats();
}
// caché de ecuaciones leídas
let EQC={};
function eqSrc(f){ if(f.variantes&&f.variantes.length){ const i=Math.min(S.var[f.id]||0,f.variantes.length-1); return f.variantes[i].ecuacion; } return f.ecuacion; }
function getEq(f){ const s=eqSrc(f); if(!(s in EQC)){ try{ EQC[s]=parseEq(s); }catch(e){ EQC[s]=null; } } return EQC[s]; }
function eqErr(f){ try{ parseEq(eqSrc(f)); return null; }catch(e){ return e.message; } }

// --- guardado ---
// 1) En este navegador: la biblioteca (formulario.lib) y los cambios pendientes (formulario.user), para no perder nada al cerrar.
// 2) En el archivo de datos: la biblioteca completa en JSON. Hoy, un archivo local (Chrome/Edge escriben en él solos);
//    mañana, otro «almacén» (Google Drive) con la misma idea: leer → juntar → escribir.
function saveLocal(){ try{ localStorage.setItem('formulario.user',JSON.stringify(USER)); }catch(e){} }
function loadLocal(){ try{ const u=JSON.parse(localStorage.getItem('formulario.user')||'null');
    if(u&&typeof u==='object') USER={temas:u.temas||{},magnitudes:u.magnitudes||{},formulas:u.formulas||{},mine:Array.isArray(u.mine)?u.mine:null,colores:u.colores||{},graficas:u.graficas||{},funciones:u.funciones||{},ejercicios:u.ejercicios||{},diagramas:u.diagramas||{},progreso:u.progreso||{}};
    // versión antigua: «mis primas» guardadas aparte
    const old=JSON.parse(localStorage.getItem('formulario.mine')||'[]'); if(Array.isArray(old)&&old.length) USER.mine=[...new Set([...(USER.mine||[]),...old])]; }catch(e){} }
let DIRTY=false; try{ DIRTY=localStorage.getItem('formulario.dirty')==='1'; }catch(e){}
function setDirty(v){ DIRTY=!!v; try{ localStorage.setItem('formulario.dirty',DIRTY?'1':'0'); }catch(e){} }
const isoAfter=(...ts)=>new Date(Math.max(Date.now(),...ts.map(t=>(Date.parse(t||0)||0)+1))).toISOString();   // fecha estrictamente posterior
function saveCache(){ try{ localStorage.setItem('formulario.lib',JSON.stringify(LIB)); }catch(e){ console.warn('No cabe la biblioteca en el navegador',e); } }
function loadCache(){ try{ const x=JSON.parse(localStorage.getItem('formulario.lib')||'null'); if(isLibLike(x)) LIB=normalizeLib(x); }catch(e){} }
const isLibLike=x=>!!x&&typeof x==='object'&&!Array.isArray(x)&&typeof x.formato==='string'&&/^formulario-v\d/.test(x.formato)&&Array.isArray(x.formulas);
// completa los campos que falten (paquetes antiguos «formulario-v1» incluidos)
function normalizeLib(x){ const L={...emptyLib(),...x};
  ['temas','formulas','graficas','funciones','ejercicios','diagramas','mine'].forEach(k=>{ if(!Array.isArray(L[k])) L[k]=[]; });
  ['magnitudes','colores','borrados','progreso'].forEach(k=>{ if(!L[k]||typeof L[k]!=='object'||Array.isArray(L[k])) L[k]={}; });
  L.temas=L.temas.map(t=>({...t,materia:t.materia||'Otras'})); L.formato='formulario-v2'; L.titulo=L.titulo||'Mi formulario'; return L; }
// ¿hay cambios que todavía no están en la biblioteca?
function hasPending(){ return ['temas','magnitudes','colores','progreso',...COLS].some(k=>USER[k]&&Object.keys(USER[k]).length)||(USER.mine!=null&&[...USER.mine].sort().join()!==[...(LIB.mine||[])].sort().join()); }
const inLib=(col,id)=>col==='magnitudes'?!!(LIB.magnitudes||{})[id]:(LIB[col]||[]).some(x=>x.id===id);
// biblioteca completa con todo lo que se ve ahora; lo cambiado desde la última vez lleva mod = T
function exportLibrary(T){ const TEMAS=ALL.temas, F=ALL.F, GR=ALL.GR, FN=ALL.FN, EJ=ALL.EJ, DG=ALL.DG; T=T||now();
  const changed=(col,id)=>!!(USER[col]&&USER[col][id]);
  const st=(col,x)=>{ const o={...x}; delete o.creado; delete o.orden; o.mod=changed(col,x.id)?T:(x.mod||0); return o; };
  const borr=JSON.parse(JSON.stringify(LIB.borrados||{}));
  ['temas','magnitudes',...COLS].forEach(col=>Object.entries(USER[col]||{}).forEach(([id,v])=>{ if(v&&(v.borrada||v.borrado)){ if(inLib(col,id)) (borr[col]=borr[col]||{})[id]=T; } else if(borr[col]) delete borr[col][id]; }));
  Object.keys(borr).forEach(k=>{ if(!Object.keys(borr[k]).length) delete borr[k]; });
  const mags={}; Object.entries(MAG).forEach(([k,m])=>{ const o={...m}; o.mod=changed('magnitudes',k)?T:(m.mod||0); mags[k]=o; });
  return {formato:'formulario-v2',app:'Formulario',id:LIB.id||newLibId(),titulo:LIB.titulo||'Mi formulario',creado:LIB.creado||new Date(T).toISOString(),modificado:isoAfter(new Date(T).toISOString(),LIB.modificado),
    temas:TEMAS.map(t=>({id:t.id,nombre:t.nombre,materia:t.materia||'Otras',...(t.oculto?{oculto:true}:{}),mod:changed('temas',t.id)?T:(t.mod||0)})),
    magnitudes:mags,formulas:F.map(f=>st('formulas',f)),graficas:GR.map(g=>st('graficas',g)),funciones:FN.map(g=>st('funciones',g)),
    ejercicios:EJ.map(g=>st('ejercicios',g)),diagramas:DG.map(g=>st('diagramas',g)),
    mine:[...MINE],mineMod:(USER.mine!=null&&[...USER.mine].sort().join()!==[...(LIB.mine||[])].sort().join())?T:(LIB.mineMod||0),
    colores:{...COLORES},coloresMod:Object.keys(USER.colores||{}).length?T:(LIB.coloresMod||0),
    progreso:Object.fromEntries(Object.entries(PROG).map(([id,p])=>[id,USER.progreso&&USER.progreso[id]?{...p,mod:T}:p])),borrados:borr}; }
// pasa los cambios pendientes a la biblioteca (no escribe el archivo: eso lo hace syncNow)
function commit(){ if(!hasPending()) return false; LIB=exportLibrary(); USER=emptyUser(); setDirty(true); saveCache(); saveLocal(); rebuild(); return true; }
// junta dos copias de la misma biblioteca: por cada elemento gana la versión con «mod» más reciente; un borrado gana a lo anterior a él
function mergeLibs(a,b){ a=normalizeLib(a); b=normalizeLib(b);
  const newer=(a.modificado||'')>=(b.modificado||'')?a:b, older=newer===a?b:a;
