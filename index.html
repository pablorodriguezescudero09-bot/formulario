// ---------- funciones: derivada simbólica ----------
// constructores que simplifican sobre la marcha (0·u, 1·u, u+0, números entre sí, −(−u)…)
const isNum=(n,v)=>n.op==='num'&&(v===undefined||n.v===v), num=v=>({op:'num',v});
const fNeg=a=>a.op==='num'?num(-a.v):a.op==='neg'?a.a:N('neg',a);
const fAdd=(a,b)=>isNum(a,0)?b:isNum(b,0)?a:(a.op==='num'&&b.op==='num')?num(a.v+b.v):b.op==='neg'?N('sub',a,b.a):b.op==='num'&&b.v<0?N('sub',a,num(-b.v)):N('add',a,b);
const fSub=(a,b)=>isNum(b,0)?a:isNum(a,0)?fNeg(b):(a.op==='num'&&b.op==='num')?num(a.v-b.v):b.op==='neg'?N('add',a,b.a):N('sub',a,b);
const same=(a,b)=>JSON.stringify(a)===JSON.stringify(b);
function fMul(a,b){ if(isNum(a,0)||isNum(b,0)) return num(0); if(isNum(a,1)) return b; if(isNum(b,1)) return a;
  if(a.op==='num'&&b.op==='num') return num(a.v*b.v); if(a.op==='neg') return fNeg(fMul(a.a,b)); if(b.op==='neg') return fNeg(fMul(a,b.a));
  if(b.op==='num') return fMul(b,a); if(a.op==='num'&&b.op==='mul'&&b.a.op==='num') return fMul(num(a.v*b.a.v),b.b);
  if(a.op==='num'&&b.op==='div'&&b.a.op==='num') return fDiv(num(a.v*b.a.v),b.b);
  if(same(a,b)) return fPow(a,num(2)); if(a.op==='pow'&&same(a.a,b)) return fPow(b,fAdd(a.b,num(1))); if(b.op==='pow'&&same(b.a,a)) return fPow(a,fAdd(b.b,num(1)));
  return N('mul',a,b); }
function fDiv(a,b){ if(isNum(a,0)) return num(0); if(isNum(b,1)) return a; if(a.op==='num'&&b.op==='num'&&Number.isInteger(a.v/b.v)) return num(a.v/b.v);
  if(b.op==='neg') return fNeg(fDiv(a,b.a)); if(a.op==='neg') return fNeg(fDiv(a.a,b)); if(same(a,b)) return num(1);
  const ma=monoOf(a), mb=monoOf(b);
  if(ma&&mb&&mb.c!==0&&(!ma.k||!mb.k||ma.k===mb.k)&&(ma.p||mb.p)){ const k=ma.k||mb.k, p=ma.p-mb.p, c=ma.c/mb.c, ci=Number.isInteger(c), x=p=>fPow({op:'var',k},num(Math.abs(p)));
    if(c<0) return fNeg(fDiv(fNeg(a),b));
    if(p>=0) return ci?fMul(num(c),x(p)):N('div',fMul(num(ma.c),x(p)),num(mb.c));
    return ci?N('div',num(c),x(p)):N('div',num(ma.c),fMul(num(mb.c),x(p))); }
  if(a.op==='mul'&&a.a.op==='num'&&b.op==='mul'&&b.a.op==='num'&&Number.isInteger(a.a.v/b.a.v)) return fDiv(fMul(num(a.a.v/b.a.v),a.b),b.b);
  if(a.op==='num'&&b.op==='mul'&&b.a.op==='num'&&Number.isInteger(a.v/b.a.v)) return fDiv(num(a.v/b.a.v),b.b);
  return N('div',a,b); }
const fPow=(a,b)=>isNum(b,0)?num(1):isNum(b,1)?a:(a.op==='num'&&b.op==='num')?num(Math.pow(a.v,b.v)):(a.op==='pow'&&a.b.op==='num'&&b.op==='num')?fPow(a.a,num(a.b.v*b.v)):N('pow',a,b);
// monomio c·x^p (o solo número) → {k,c,p}; sirve para cancelar potencias de x al dividir
function monoOf(n){ if(n.op==='num') return {c:n.v,p:0}; if(n.op==='var') return {k:n.k,c:1,p:1}; if(n.op==='pow'&&n.a.op==='var'&&n.b.op==='num') return {k:n.a.k,c:1,p:n.b.v};
  if(n.op==='neg'){ const m=monoOf(n.a); return m&&{...m,c:-m.c}; } if(n.op==='mul'&&n.a.op==='num'){ const m=monoOf(n.b); return m&&{...m,c:m.c*n.a.v}; } return null; }
function D(n,v){ switch(n.op){
  case 'num': case 'pi': return num(0);
  case 'var': return num(n.k===v?1:0);
  case 'hl': return D(n.a,v);
  case 'add': return fAdd(D(n.a,v),D(n.b,v));
  case 'sub': return fSub(D(n.a,v),D(n.b,v));
  case 'neg': return fNeg(D(n.a,v));
  case 'mul': return fAdd(fMul(D(n.a,v),n.b),fMul(n.a,D(n.b,v)));
  case 'div': return has(n.b,v)?fDiv(fSub(fMul(D(n.a,v),n.b),fMul(n.a,D(n.b,v))),fPow(n.b,num(2))):fDiv(D(n.a,v),n.b);
  case 'pow': if(!has(n.b,v)){ const c=n.b, e=c.op==='num'?num(c.v-1):fSub(c,num(1)); return fMul(fMul(c,fPow(n.a,e)),D(n.a,v)); }
              if(!has(n.a,v)) return fMul(fMul(n,N('ln',n.a)),D(n.b,v));
              return fMul(n,fAdd(fMul(D(n.b,v),N('ln',n.a)),fDiv(fMul(n.b,D(n.a,v)),n.a)));
  case 'sqrt': return fDiv(D(n.a,v),fMul(num(2),N('sqrt',n.a)));
  case 'exp': return fMul(n,D(n.a,v));
  case 'ln': return fDiv(D(n.a,v),n.a);
  case 'log': return fDiv(D(n.a,v),fMul(n.a,N('ln',num(10))));
  case 'sin': return fMul(N('cos',n.a),D(n.a,v));
  case 'cos': return fNeg(fMul(N('sin',n.a),D(n.a,v)));
  case 'tan': return fDiv(D(n.a,v),fPow(N('cos',n.a),num(2)));
  case 'asin': return fDiv(D(n.a,v),N('sqrt',fSub(num(1),fPow(n.a,num(2)))));
  case 'acos': return fNeg(fDiv(D(n.a,v),N('sqrt',fSub(num(1),fPow(n.a,num(2))))));
  case 'atan': return fDiv(D(n.a,v),fAdd(num(1),fPow(n.a,num(2))));
  default: return num(NaN);
}}

// ---------- funciones: análisis numérico sobre el tramo estudiado ----------
const median=a=>{ if(!a.length) return 0; const b=[...a].sort((p,q)=>p-q); return b[Math.floor(b.length/2)]; };
function fnAnalysis(fn){
  const tree=parseSide(fn.expresion), d1=D(tree,'x'), d2=D(d1,'x');
  const f=x=>ev(tree,{x}), f1=x=>ev(d1,{x}), f2=x=>ev(d2,{x});
  const [a,b]=fn.rango, NS=2400, h=(b-a)/NS, xs=[], ys=[], y1s=[], y2s=[];
  for(let i=0;i<=NS;i++){ const x=a+i*h; xs.push(x); const y=f(x), p=f1(x), q=f2(x); ys.push(isFinite(y)?y:NaN); y1s.push(isFinite(p)?p:NaN); y2s.push(isFinite(q)?q:NaN); }
  const scale=1+median(ys.filter(isFinite).map(Math.abs));
  const bis=(g,lo,hi)=>{ let flo=g(lo); for(let i=0;i<80;i++){ const m=(lo+hi)/2, fm=g(m); if(!isFinite(fm)) return null; if((flo<0)!==(fm<0)) hi=m; else { lo=m; flo=fm; } } return (lo+hi)/2; };
  const tern=(g,lo,hi)=>{ for(let i=0;i<120;i++){ const m1=lo+(hi-lo)/3, m2=hi-(hi-lo)/3; if(g(m1)<g(m2)) hi=m2; else lo=m1; } return (lo+hi)/2; };
  const uniq=(arr,tol)=>{ const o=[]; arr.sort((p,q)=>p-q).forEach(x=>{ if(!o.length||x-o[o.length-1]>tol) o.push(x); }); return o; };
  // raíces de g: cambios de signo (bisección) y mínimos de |g| que llegan a cero (búsqueda ternaria)
  function roots(g,gs){ const sc=1+median(gs.filter(isFinite).map(Math.abs)); const out=[]; if(gs.every(v=>v===0)) return [];   // g idénticamente nula (f constante)
    for(let i=0;i<NS;i++){ const y0=gs[i], y1=gs[i+1]; if(!isFinite(y0)||!isFinite(y1)) continue;
      if(y0===0){ out.push(xs[i]); continue; }
      if((y0<0)!==(y1<0)){ const r=bis(g,xs[i],xs[i+1]); if(r!==null&&Math.abs(g(r))<1e-6*sc) out.push(r); }
      else if(i>0&&isFinite(gs[i-1])&&Math.abs(y0)<Math.abs(gs[i-1])&&Math.abs(y0)<=Math.abs(y1)&&Math.abs(y0)<1e-2*sc){ const r=tern(x=>Math.abs(g(x)),xs[i-1],xs[i+1]); if(Math.abs(g(r))<1e-7*sc) out.push(r); } }
    return uniq(out,h*2); }
  // dominio: tramos donde f no existe (NaN seguidos); los puntos sueltos son polos exactos
  const gaps=[]; for(let i=0;i<=NS;){ if(isFinite(ys[i])){ i++; continue; } let j=i; while(j<=NS&&!isFinite(ys[j])) j++; if(j-i>=2) gaps.push([xs[i],xs[Math.min(j,NS)]]); i=j; }
  const edge=(lo,hi,wantLo)=>{ for(let i=0;i<60;i++){ const m=(lo+hi)/2; if(isFinite(f(m))===wantLo) lo=m; else hi=m; } return (lo+hi)/2; };
  gaps.forEach(gp=>{ if(gp[0]>a) gp[0]=edge(gp[0]-h,gp[0],true); if(gp[1]<b) gp[1]=edge(gp[1]-h,gp[1],false); });
  // asíntotas verticales: donde |f| se dispara (cambio de signo con bisección que no llega a cero, pico de |f| o borde del dominio)
  const BIG=1e5*scale, asym=[];
  for(let i=0;i<NS;i++){ const y0=ys[i], y1=ys[i+1];
    if(isFinite(y0)&&isFinite(y1)&&(y0<0)!==(y1<0)&&(Math.abs(y0)>10*scale||Math.abs(y1)>10*scale)){ const r=bis(f,xs[i],xs[i+1]); if(r!==null&&Math.abs(f(r))>BIG) asym.push(r); }
    if(i>0&&isFinite(y0)&&Math.abs(y0)>50*scale&&Math.abs(y0)>=Math.abs(ys[i-1]||0)&&Math.abs(y0)>=Math.abs(y1||0)){ const r=tern(x=>-Math.abs(f(x)),xs[i-1],xs[i+1]); if(Math.abs(f(r))>BIG) asym.push(r); }
    // muestra aislada no finita (polo justo en un punto de la rejilla): f se dispara a su lado
    if(!isFinite(y0)&&isFinite(y1)&&(i===0||isFinite(ys[i-1]))){ const e=1e-9*(1+Math.abs(xs[i])); if(Math.abs(f(xs[i]+e))>BIG||Math.abs(f(xs[i]-e))>BIG) asym.push(xs[i]); } }
  // en el borde del dominio hay asíntota si |f| se dispara o crece sin freno al acercarse (ln x en 0)
  const blows=(x,dir)=>{ const e1=Math.abs(f(x+dir*1e-9*(1+Math.abs(x)))), e2=Math.abs(f(x+dir*1e-3*(1+Math.abs(x)))); return isFinite(e1)&&(e1>BIG||(e1>2*e2&&e1>3*scale)); };
  gaps.forEach(([p,q])=>{ if(p>a&&blows(p,-1)) asym.push(p); if(q<b&&blows(q,1)) asym.push(q); });
  const asymU=uniq(asym,h*3);
  const zeros=roots(f,ys).filter(z=>!asymU.some(x=>Math.abs(x-z)<h*3));
  const y0=(a<=0&&0<=b)?f(0):NaN;
  // extremos e inflexión
  const crit=roots(f1,y1s).filter(z=>!asymU.some(x=>Math.abs(x-z)<h*3)&&isFinite(f(z)));
  const d=5*h, kind=c=>{ const s=f2(c); if(isFinite(s)&&Math.abs(s)>1e-7*scale) return s>0?'min':'max'; const l=f(c-d), r=f(c+d), m=f(c); if(isFinite(l)&&isFinite(r)){ if(m<l&&m<r) return 'min'; if(m>l&&m>r) return 'max'; } return 'silla'; };
  const extremos=crit.map(c=>({x:c,y:f(c),k:kind(c)}));
  const infl=roots(f2,y2s).filter(z=>!asymU.some(x=>Math.abs(x-z)<h*3)&&isFinite(f(z))).filter(z=>{ const l=f2(z-d), r=f2(z+d); return isFinite(l)&&isFinite(r)&&(l<0)!==(r<0); });
  // tramos: entre puntos singulares, el signo de f, f' y f'' en el punto medio
  const cuts=uniq([a,b,...zeros,...asymU,...crit,...infl,...gaps.flat()],h/2);
  function tramos(g,label){ const out=[]; for(let i=0;i<cuts.length-1;i++){ const p=cuts[i], q=cuts[i+1]; if(q-p<h) continue; const m=(p+q)/2, v=g(m); if(!isFinite(v)||!isFinite(f(m))) continue; const sg=Math.abs(v)<1e-12*scale?0:(v>0?1:-1);
      const last=out[out.length-1]; const barrier=asymU.some(x=>Math.abs(x-p)<h)||gaps.some(gp=>Math.abs(gp[1]-p)<h||Math.abs(gp[0]-p)<h);
      if(last&&last.s===sg&&!barrier&&Math.abs(last.b-p)<h&&!label(p)) last.b=q; else out.push({a:p,b:q,s:sg}); } return out; }
  const signo=tramos(f,p=>zeros.some(z=>Math.abs(z-p)<h));
  const mono=tramos(f1,p=>crit.some(z=>Math.abs(z-p)<h));
  const curv=tramos(f2,p=>infl.some(z=>Math.abs(z-p)<h));
  // comportamiento en el infinito
  function lim(sgn){ const X=[1e3,1e4,1e5,1e6].map(v=>sgn*v), Y=X.map(f); if(!Y.every(isFinite)) return {t:'none'};
    if(Math.abs(Y[3]-Y[2])<1e-4*(1+Math.abs(Y[3]))) return {t:'h',L:Math.abs(Y[3])<1e-5*scale?0:Y[3]};
    const m=(Y[3]-Y[2])/(X[3]-X[2]), m2=(Y[2]-Y[1])/(X[2]-X[1]);
    if(isFinite(m)&&Math.abs(m)>1e-9&&Math.abs(m-m2)<1e-3*(1+Math.abs(m))){ const bb=Y[3]-m*X[3], b2=Y[2]-m2*X[2]; if(Math.abs(bb-b2)<1e-2*(1+Math.abs(bb))) return {t:'o',m,b:Math.abs(bb)<1e-5*(1+Math.abs(m))?0:bb}; }
    const ab=Y.map(Math.abs); if(ab[3]>ab[2]&&ab[2]>ab[1]&&ab[1]>ab[0]&&(Y[3]>0)===(Y[0]>0)) return {t:'inf',s:Y[3]>0?'+∞':'−∞'};   // crece sin parar (ln, raíz…)
    if(Math.max(...ab)<1e3*scale) return {t:'osc'};
    return {t:'inf',s:Y[3]>0?'+∞':'−∞'}; }
  const linf={neg:lim(-1),pos:lim(1)};
  // simetría
  let par='ninguna'; if(a<0&&0<b){ const M=Math.min(-a,b); let ev_=true, od=true, n=0; for(let i=1;i<=40;i++){ const x=M*i/40, p=f(x), q=f(-x); if(!isFinite(p)||!isFinite(q)) continue; n++; if(Math.abs(p-q)>1e-9*(1+Math.abs(p))) ev_=false; if(Math.abs(p+q)>1e-9*(1+Math.abs(p))) od=false; } if(n>10){ if(ev_) par='par'; else if(od) par='impar'; } }
  return {tree,d1,d2,f,f1,f2,gaps,asym:asymU,zeros,y0,extremos,infl,signo,mono,curv,linf,par,h};
}
const fnOf=id=>FN.find(x=>x.id===id);

const fx=v=>{ if(isFinite(v)&&Math.abs(v)<1e-9) v=0; const r=fmtV(v); return r===null?'—':r; };   // los casi-cero numéricos se enseñan como 0
const iv=(p,q,a,b)=>`(${p<=a?fx(a):fx(p)}, ${q>=b?fx(b):fx(q)})`;
const txtEq=(lbl,tree)=>eqH({op:'txt',h:lbl},tree,-99);
function fnGraph(fn,A){ const ser=[{nombre:'f(x)',tree:A.tree,key:'y'}]; if(S.fnd1) ser.push({nombre:"f′(x)",tree:A.d1,key:'y'});

  if(isFinite(A.y0)) puntos.push({x:0,y:A.y0,texto:'corte con el eje Y',col:'var(--pen)'});
  return {id:'fn_'+fn.id,titulo:fn.nombre,x:'x',rango:fn.rango,series:ser,pure:true,ylabel:S.fnd1?'f(x), f′(x)':'f(x)',marcas:A.asym.map(x=>({x,texto:'asíntota'})),puntos}; }

const NW=210, NH=60, GX=80, GY=16, PAD=24;
function mapModel(){
  const mat=curMat(), own=TEMAS.filter(t=>(t.materia||'Otras')===mat).map(t=>t.id);
  let tsel=S.mapT; if(!(tsel==='*'||own.includes(tsel))) tsel=(byId[S.id]&&own.includes(byId[S.id].tema))?byId[S.id].tema:(own[0]||'*');
  const nodes=F.filter(f=>tsel==='*'?matOf(f)===mat:f.tema===tsel), set=new Set(nodes.map(f=>f.id));
  const ghosts=[]; nodes.forEach(f=>(f.deDonde||[]).forEach(p=>{ if(!set.has(p)&&byId[p]&&!ghosts.includes(p)) ghosts.push(p); }));
  const all=[...nodes.map(f=>f.id),...ghosts], inSet=new Set(all), gset=new Set(ghosts);
  // profundidad: 0 para primas sin padres, 1 + la del padre más profundo
  const depth={};
  const dep=(id,st)=>{ if(depth[id]!==undefined) return depth[id]; if(gset.has(id)) return depth[id]=0; if(st.has(id)) return 0; st.add(id);
    const ps=(byId[id].deDonde||[]).filter(p=>inSet.has(p)); const d=ps.length?1+Math.max(...ps.map(p=>dep(p,st))):0; st.delete(id); return depth[id]=d; };
  all.forEach(id=>dep(id,new Set()));
  const cols=[]; all.forEach(id=>{ (cols[depth[id]]=cols[depth[id]]||[]).push(id); });
  const pos={};
  cols.forEach((col,c)=>{ if(c>0){ const bar=id=>{ const ps=(byId[id].deDonde||[]).filter(p=>pos[p]); return ps.length?ps.reduce((s,p)=>s+pos[p].r,0)/ps.length:999; }; col.sort((a,b)=>bar(a)-bar(b)); }
    col.forEach((id,r)=>{ pos[id]={c,r,x:PAD+c*(NW+GX),y:PAD+r*(NH+GY)}; }); });
  const edges=[]; nodes.forEach(f=>(f.deDonde||[]).forEach(p=>{ if(pos[p]) edges.push([p,f.id]); }));
  const W=PAD*2+Math.max(1,cols.length)*(NW+GX)-GX, H=PAD*2+Math.max(1,...cols.map(c=>c.length))*(NH+GY)-GY;
  return {tsel,all,gset,pos,edges,W,H};
}

async function ghFetch(url,opt){ let r; try{ r=await fetch(url,{cache:'no-store',...opt}); }catch(e){ const x=new Error('sin conexión; se subirá al volver a tener internet'); x.offline=true; throw x; }
  if(r.status===401) throw new Error('GitHub no acepta la clave: puede estar mal copiada o haber caducado');
  if(r.status===403||r.status===429) throw new Error('GitHub ha rechazado la operación: comprueba que la clave tenga permiso «Contents: Read and write» o inténtalo dentro de un rato');
  return r; }
function ghHandle(cfg){ const url=`${GH_API}/repos/${cfg.repo}/contents/${GH_PATH}`, H=x=>ghHeaders(cfg.token,x); let sha=null, etag='', text='', fresh=false;
  async function pull(){ const r=await ghFetch(url,{headers:H(etag?{'If-None-Match':etag}:{})}); if(r.status===304) return; if(r.status===404){ sha=null; etag=''; text=''; return; } if(!r.ok) throw new Error('GitHub ha respondido con un error ('+r.status+')');
    const j=await r.json(); sha=j.sha; etag=r.headers.get('ETag')||'';
    if(j.encoding==='base64'&&j.content) text=ghTxt(j.content); else { const q=await ghFetch(url,{headers:H({Accept:'application/vnd.github.raw+json'})}); if(!q.ok) throw new Error('GitHub ha respondido con un error ('+q.status+')'); text=await q.text(); } }
  const file=()=>({lastModified:sha||'',text:async()=>text});
  return {gh:true,name:'GitHub · '+cfg.repo,repo:cfg.repo,async queryPermission(){ return 'granted'; },async requestPermission(){ return 'granted'; },
    async getFile(){ if(fresh) fresh=false; else await pull(); return file(); },
    async createWritable(){ let body=''; return {write:async t=>{ body=t; },close:async()=>{ const r=await ghFetch(url,{method:'PUT',headers:H({'Content-Type':'application/json'}),body:JSON.stringify({message:'Guardado desde Formulario',content:ghB64(body),...(sha?{sha}:{})})});
        if(r.status===409||r.status===422){ const x=new Error('otro dispositivo acaba de guardar'); x.conflict=true; throw x; } if(!r.ok) throw new Error('GitHub no ha podido guardar ('+r.status+')');
        const j=await r.json(); sha=j.content.sha; etag=''; text=body; fresh=true; }}; }}; }
async function ghConnect(repoIn,tokenIn){ const repo=String(repoIn||'').trim().replace(/^https?:\/\/github\.com\//i,'').replace(/\.git$/i,'').replace(/\/+$/,''), token=String(tokenIn||'').trim();
  if(!/^[\w.-]+\/[\w.-]+$/.test(repo)) throw new Error('Escribe el repositorio como usuario/nombre.'); if(!token) throw new Error('Falta la clave de GitHub.');
  const m=await ghFetch(`${GH_API}/repos/${repo}`,{headers:ghHeaders(token)}); if(m.status===404) throw new Error('No encuentro ese repositorio, o la clave no tiene acceso a él.'); if(!m.ok) throw new Error('GitHub ha respondido con un error ('+m.status+').');
  const info=await m.json(); if(!info.private) throw new Error('Ese repositorio es público y tus datos serían visibles para cualquiera. Usa uno privado.');
  const cfg={repo,token}, h=ghHandle(cfg), f=await h.getFile(), txt=await f.text(); let remote=null;
  if(txt.trim()){ try{ remote=JSON.parse(txt); }catch(e){ throw new Error('El archivo de ese repositorio no es un JSON válido.'); } if(!isLibLike(remote)) throw new Error('El archivo de ese repositorio no tiene el formato de Formulario.'); }
  if(!remote&&!LIB.id) throw new Error('Ese repositorio todavía no tiene datos. Conecta primero desde el ordenador, donde está tu archivo.');
  try{ await IDB.del('datos'); }catch(e){}
  if(remote){ const ok=await adoptLibrary(remote,{handle:h,perm:'granted',lastMod:f.lastModified}); if(!ok) return false; }
  else { commit(); if(!LIB.modificado) LIB=exportLibrary(); FILE.handle=h; FILE.name=h.name; FILE.perm='granted'; FILE.seen=''; setDirty(true); persistSeen(); }
  try{ localStorage.setItem('formulario.gh',JSON.stringify(cfg)); }catch(e){}
  await syncNow(); render(); return true; }

function edSave(){
  const D=S.draft, d=D.f, E=[];
  if(!d.nombre.trim()) E.push('Falta el nombre.');
  if(d.tema==='__new'&&!D.nt.nombre.trim()) E.push('Falta el nombre del nuevo tema.');
  try{ parseEq(d.ecuacion); }catch(e){ E.push('Ecuación: '+e.message+'.'); }
  if(/["\[\]]/.test(d.ecuacion)) E.push('La ecuación de la fórmula no puede llevar "texto" ni [ ]: eso solo va en los pasos.');
  d.variantes.forEach((v,i)=>{ if(!v.nombre.trim()) E.push(`Variante ${i+1}: falta el nombre.`); try{ parseEq(v.ecuacion); }catch(e){ E.push(`Variante ${i+1}: ${e.message}.`); } });
  d.pasos.forEach((p,i)=>String(p.ecuacion).split('\n').filter(x=>x.trim()).forEach(x=>{ if(x.trim()==='@'){ if(!d.variantes.length) E.push(`Paso ${i+1}: «@» solo vale si hay variantes.`); return; } try{ x.split(/=|~|∝/).forEach(parseSide); }catch(e){ E.push(`Paso ${i+1}: ${e.message}.`); } }));
  unknownKeys(d).forEach(k=>{ const m=D.mags[k]||{}; if(!RE_MAG.test(k)) E.push(`«${k}» no vale como clave.`); if(!m.nombre||!m.unidad||!m.simbolo) E.push(`Define la magnitud «${k}»: símbolo, significado y unidad.`); });
  D.err=E; if(E.length){ renderEditor(); document.querySelector('.errbox')?.scrollIntoView({block:'center'}); return; }
  // tema nuevo
  let tema=d.tema;
  if(tema==='__new'){ tema=uniqueTema(slug(D.nt.nombre)); saveTema({id:tema,nombre:D.nt.nombre.trim(),materia:D.nt.materia.trim()||'Otras'}); }
  // magnitudes nuevas
  const nk=unknownKeys(d); nk.forEach(k=>{ const m=D.mags[k]; USER.magnitudes[k]={simbolo:m.simbolo.trim(),nombre:m.nombre.trim(),unidad:m.unidad.trim()}; });
  if(nk.length){ rebuild(); pushMeta(); }
  const out={id:d.id,tema,tipo:d.tipo,nombre:d.nombre.trim(),ecuacion:d.ecuacion.trim()};
  if(d.variantes.length) out.variantes=d.variantes.map(v=>({nombre:v.nombre.trim(),ecuacion:v.ecuacion.trim()}));
  if(d.nota&&d.nota.trim()) out.nota=d.nota.trim();
  if(d.deDonde.length) out.deDonde=[...d.deDonde];
  const ms=(d.materias||[]).filter(m=>m!==((temaOf(tema)||{}).materia||'Otras')); if(ms.length) out.materias=ms;
  out.pasos=d.pasos.map(p=>{ const L=String(p.ecuacion).split('\n').map(x=>x.trim()).filter(Boolean); const x={texto:p.texto.trim(),ecuacion:L.length===1?L[0]:L}; if(p.usa.length) x.usa=[...p.usa]; return x; });
  if(d.creado) out.creado=d.creado;
  { const old=byId[d.id]; if(old){ if(old.alias) out.alias=old.alias; if(old.escrita) out.escrita=old.escrita; } }
  saveFormula(out); delete EQC[eqSrc(out)];
  S.draft=null; S.view='f'; S.id=out.id; S.u=null; S.shown=999; S.ds=999; render(); toast('Fórmula guardada.');
}
function uniqueTema(base){ let id=base||'tema', i=2; while(ALL.temas.some(t=>t.id===id)) id=base+'_'+(i++); return id; }
// inserta texto en la ecuación activa, dejando el cursor dentro de los paréntesis
function insertAtCursor(text){
  const el=S.draft&&S.draft.last&&document.getElementById(S.draft.last); if(!el){ toast('Pulsa primero dentro de una ecuación.'); return; }
  const a=el.selectionStart??el.value.length, b=el.selectionEnd??a;
  el.setRangeText(text,a,b,'end'); const inside=text.indexOf('()')>=0?text.indexOf('()')+1:(text.endsWith(')')||text.endsWith(']')||text==='""')?text.length-1:text.length;
  el.focus(); el.setSelectionRange(a+inside,a+inside); el.dispatchEvent(new Event('input',{bubbles:true}));
}

// ---------- render general ----------
let ACTEL=null;   // botón que ha lanzado la acción en curso (para leer sus data-…)
let RENDER0=false;
function render(){
  if(!RENDER0){ RENDER0=true; if(isHid(S.id)) S.id=null; }
  coerceView();
  document.getElementById('main').classList.remove('ejblocked');
  renderFileStatus();
  if(S.view==='v'||S.view==='x'||S.view==='n'||S.view==='y'){ S.view=vSub(S.view==='v'?S.vsub:S.view); S.vsub=S.view; }
  const DEV=S.view==='m'||S.view==='d'; if(DEV) S.dev=S.view; const VIS=S.view==='x'||S.view==='n'||S.view==='y';
  if(!DEV) S.home=S.view==='e'?'f':S.view;
  document.querySelectorAll('.hctl [data-view]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.view===S.view||(S.view==='e'&&b.dataset.view==='f')||(VIS&&b.dataset.view==='v'))));
  document.getElementById('gear').setAttribute('aria-pressed',String(DEV));
  document.getElementById('toggles').style.visibility=S.view==='f'?'':'hidden';
  document.getElementById('layout').classList.toggle('wide',S.view==='m'||S.view==='d'||S.view==='e'||S.view==='p');
  const mat=curMat();
  if(byId[S.id]&&!inScope(byId[S.id],mat)){ const jid=S.id, jv=S.view; matEnter(matOf(byId[jid])); S.id=jid; S.view=jv; }           // la asignatura sigue a la fórmula abierta
  else if(!byId[S.id]) S.id=(F.find(f=>matOf(f)===mat)||F.find(f=>inScope(f,mat))||{}).id||null;
  applyTheme(); renderMats();
  if(S.view==='g'){ renderGNav(); renderGMain(); }
  else if(S.view==='m'){ renderMap(); }
  else if(VIS&&vEmpty()){ renderVNav(); renderVEmpty(); }
  else if(S.view==='x'){ renderVNav(); renderXMain(); }
  else if(S.view==='n'){ renderVNav(); renderFMain(); }
  else if(S.view==='j'){ renderJNav(); renderJMain(); }
  else if(S.view==='y'){ renderVNav(); renderYMain(); }
  else if(S.view==='p'){ renderPrint(); }
  else if(S.view==='d'){ renderDatos(); }
  else if(S.view==='e'){ renderEditor(); }
  else { renderNav(); renderMain(); }
  saveUI();
  gridAlign();
}
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.hidden=false; clearTimeout(toast.h); toast.h=setTimeout(()=>{ t.hidden=true; },3800); }

// historial de navegación para la flecha «Atrás»
const HIST=[];
const snap=()=>({view:S.view,id:S.id,u:S.u,gv:S.gv,mat:S.mat,gx:S.gx,fn:S.fn,ej:S.ej,dg:S.dg});
function go(fn){ if(S.view==='e'&&S.draft){ S.draft=null; toast('Has salido del editor sin guardar los cambios.'); } const s=snap(); fn(); const n=snap();
  if(s.view!=='e'&&s.mat===n.mat&&(s.view!==n.view||(n.view==='f'&&s.id!==n.id)||(n.view==='g'&&s.gv!==n.gv)||(n.view==='x'&&s.gx!==n.gx)||(n.view==='n'&&s.fn!==n.fn)||(n.view==='j'&&s.ej!==n.ej)||(n.view==='y'&&s.dg!==n.dg))) HIST.push(s); updBack(); }
function back(){ const s=HIST.pop(); if(!s) return; S.draft=null; if(s.mat&&s.mat!==S.mat) matEnter(s.mat); Object.assign(S,s,{reveal:false,shown:S.repaso?0:999,ds:S.repaso?0:999,mapSel:null}); render(); updBack(); toMain(); }
function updBack(){ const b=document.getElementById('back'); if(!HIST.length){ b.hidden=true; return; }
  const s=HIST[HIST.length-1];
  document.getElementById('backlb').textContent= s.view==='g'&&MAG[s.gv] ? 'Glosario · '+strip(MAG[s.gv].simbolo) : s.view==='m'?'Mapa':s.view==='x'?'Gráficos · curva':s.view==='n'?'Gráficos · función':s.view==='j'?'Ejercicios':s.view==='y'?'Gráficos · diagrama':s.view==='p'?'Imprimir':s.view==='d'?'Mis datos':(byId[s.id]||{}).nombre||'';
  b.hidden=false; }
const toMain=()=>{ if(innerWidth<900) document.getElementById('main').scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth',block:'start'}); };
function select(id){ if(id===S.id&&S.view==='f') return;
  go(()=>{ S.view='f'; S.id=id; S.u=null; S.reveal=false; S.shown=S.repaso?0:999; S.ds=S.repaso?0:999; if(byId[id]&&!passF(byId[id])) S.filt='all'; render(); }); toMain(); }
function openFormula(id,k){ go(()=>{ S.view='f'; S.id=id; S.u=k||null; S.reveal=false; S.shown=S.repaso?0:999; S.ds=S.repaso?0:999; if(!passF(byId[id])) S.filt='all'; render(); }); toMain(); }
function openGloss(k){ go(()=>{ S.view='g'; S.gv=k; S.confirm=null; render(); }); toMain(); }

// ---------- fuente Sans Forgetica ----------
let FONTLOADED=null;   // true: cargada desde «⚙ Ajustes · Mis datos»; false: no hay archivo cargado; null: sin comprobar
function setFont(on){ const r=document.documentElement; if(on) r.dataset.font='forgetica'; else r.removeAttribute('data-font');
  try{ localStorage.setItem('formulario.font',on?'forgetica':'normal'); }catch(e){}
  const b=document.getElementById('tgF'); if(b) b.setAttribute('aria-pressed',String(on));
  if(on&&document.fonts&&document.fonts.load) document.fonts.load('16px "Sans Forgetica"').then(fs=>{ if(!fs.length) toast('No encuentro la fuente Sans Forgetica. Instálala en el sistema, deja el archivo .otf junto a Formulario.html o cárgalo en «Mis datos → 5 · Fuente».'); }).catch(()=>{}); }
async function loadFontData(){ let data=null; try{ data=localStorage.getItem('formulario.fontdata'); }catch(e){} if(!data){ FONTLOADED=false; return false; }
  try{ const ff=new FontFace('Sans Forgetica','url('+data+')'); await ff.load(); document.fonts.add(ff); FONTLOADED=true; return true; }catch(e){ console.warn(e); FONTLOADED=false; return false; } }

/* ============ 7. EVENTOS ============ */
function boot(){
  loadCache(); loadLocal(); rebuild();
  try{ const u=JSON.parse(localStorage.getItem('formulario.ui')||'{}');
    if(typeof u.mat==='string') S.mat=u.mat; if(u.id&&byId[u.id]) S.id=u.id; if(['f','g','m','x','n','j','y','p','d'].includes(u.view)) S.view=u.view; if(u.gv&&MAG[u.gv]) S.gv=u.gv; ['gx','fn','ej','dg'].forEach(k=>{ if(typeof u[k]==='string') S[k]=u[k]; });
    if(u.ejgr&&typeof u.ejgr==='object') S.ejGrM={...u.ejgr}; if(u.dgw&&typeof u.dgw==='object') Object.entries(u.dgw).forEach(([k,v])=>{ if(+v>0) S.dgW[k]=+v; }); if(u.mats&&typeof u.mats==='object') S.matMem=u.mats; if(u.ejfs&&typeof u.ejfs==='object') Object.entries(u.ejfs).forEach(([m,v])=>{ if(v&&Array.isArray(v.ids)) S.ejFs[m]={ids:v.ids.filter(x=>typeof x==='string'),mode:v.mode==='only'?'only':'any',open:!!v.open}; });
    if(['all','both','claude','mine'].includes(u.filt)) S.filt=u.filt; if(Array.isArray(u.closed)) S.closed=new Set(u.closed); }catch(e){}
  if(!S.id) S.id=(F.find(f=>S.mat&&matOf(f)===S.mat)||F[0]||{}).id||null;   // sin fórmula guardada: la primera de la asignatura guardada
  try{ if(localStorage.getItem('formulario.font')==='forgetica'){ document.documentElement.dataset.font='forgetica'; const b=document.getElementById('tgF'); if(b) b.setAttribute('aria-pressed','true'); } }catch(e){}
  loadFontData();
  render(); initFile();
  // vuelve a mirar el archivo al volver a la pestaña y cada medio minuto: puede haberlo cambiado otro dispositivo
  addEventListener('focus',checkRemote); document.addEventListener('visibilitychange',()=>{ if(!document.hidden) checkRemote(); });
  setInterval(()=>{ if(!document.hidden) checkRemote(); },30000);
  // antes de cerrar, si hay algo pendiente, se intenta escribir ya
  addEventListener('online',checkRemote); document.addEventListener('visibilitychange',()=>{ if(document.hidden&&(hasPending()||DIRTY)&&FILE.handle&&FILE.handle.gh) syncNow(); });
  if('serviceWorker' in navigator&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});
  addEventListener('pagehide',()=>{ if((hasPending()||DIRTY)&&FILE.handle&&FILE.perm==='granted') syncNow(); });
  try{ matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>applyTheme()); }catch(e){}

  document.addEventListener('click',e=>{
    const t=e.target;
    if(t.closest('#back')){ back(); return; }
    const vb=t.closest('[data-view]'); if(vb){ const v=vb.dataset.view; if(v!==S.view||S.view==='e') go(()=>{ S.view=v; S.confirm=null; S.mapSel=null; render(); }); return; }
    // cambiar de asignatura: se abre su primera fórmula y todo (índice, glosario, mapa, color) pasa a ser solo de ella
    const mp=t.closest('.mt[data-mat]'); if(mp){ const m=mp.dataset.mat; if(m!==S.mat) go(()=>{ matEnter(m); render(); }); return; }
    // --- editor ---
    if(S.view==='e'){
      const ins=t.closest('[data-ins]'); if(ins){ insertAtCursor(ins.dataset.ins); return; }
      const ea=t.closest('[data-edact]'); if(ea){ edAct(ea.dataset.edact); return; }
      // quitar un enlace (sale de… / usa en este paso)
      const rm=t.closest('[data-edrm]'); if(rm){ const where=rm.dataset.edrm, v=rm.dataset.v, d=S.draft.f;
        if(where==='de') d.deDonde=d.deDonde.filter(x=>x!==v); else { const i=+where.split(':')[1]; d.pasos[i].usa=d.pasos[i].usa.filter(x=>x!==v); }
        renderEditor(); return; }
    }
    const gxb=t.closest('[data-gx]'); if(gxb){ openGraf(gxb.dataset.gx); return; }
    const fnb=t.closest('[data-fn]'); if(fnb){ openFn(fnb.dataset.fn); return; }
    const ejb=t.closest('[data-ej]'); if(ejb){ openEj(ejb.dataset.ej); return; }
    // opciones de impresión
    const prb=t.closest('[data-pr]'); if(prb){ const o=prOpts(); o[prb.dataset.pr]=prb.dataset.v; prSave(); renderPrint(); renderMats(); return; }
    const pra=t.closest('[data-prall]'); if(pra){ const [key,tema,on]=pra.dataset.prall.split('|'), o=prOpts(); const items=(o.tipo==='f'?F:o.tipo==='e'?EJ:DG).filter(x=>x.tema===tema).map(x=>x.id); o[key]=on==='1'?[...new Set([...o[key],...items])]:o[key].filter(id=>!items.includes(id)); prSave(); renderPrint(); return; }
    const dgo=t.closest('[data-dgo]'); if(dgo){ openDg(dgo.dataset.dgo); return; }
    const dgb=t.closest('[data-dg]'); if(dgb&&S.view==='y'){ if(S.dgMeasure&&t.closest('#dgsvg')) { /* en modo medida el clic sobre el dibujo toma puntos */ } else { S.dgSel=S.dgSel===dgb.dataset.dg?null:dgb.dataset.dg; dgRefresh(); return; } }
    if(S.view==='y'&&S.dgMeasure&&t.closest('#dgsvg')){ const P_=dgPointer(e); if(P_){ let best=null; (P_.g.lineas||[]).forEach(l=>{ const y=dgLineY(l,P_.x); if(y===null) return; const d=Math.abs(P_.sc.Y(y)-P_.py); if(d<14&&(!best||d<best.d)) best={d,y}; }); const pt=[P_.x,best?best.y:P_.y]; S.dgPts=S.dgPts.length>=2?[pt]:[...S.dgPts,pt]; dgRefresh(); } return; }
    // editor de ejercicios
    if(S.jdraft){ const jt=t.closest('[data-jtipo]'); if(jt){ const [i,tp]=jt.dataset.jtipo.split(':'); S.jdraft.pasos[+i].tipo=tp; renderJMain(); return; }
      const ja=t.closest('[data-jact]'); if(ja){ const [k,iS]=ja.dataset.jact.split(':'), i=+iS, d=S.jdraft;
        if(k==='adddato') d.datos.push({k:'',v:''}); else if(k==='rmdato') d.datos.splice(i,1); else if(k==='addpaso') d.pasos.push({tipo:'f',texto:'',formula:'',incognita:'',ecuacion:'',asigna:''}); else if(k==='rmpaso') d.pasos.splice(i,1);
        else if(k==='pup'&&i>0) [d.pasos[i-1],d.pasos[i]]=[d.pasos[i],d.pasos[i-1]]; else if(k==='pdown'&&i<d.pasos.length-1) [d.pasos[i+1],d.pasos[i]]=[d.pasos[i],d.pasos[i+1]];
        renderJMain(); return; } }
    if(t.closest('#tgF')){ setFont(document.documentElement.dataset.font!=='forgetica'); return; }
    const grs=t.closest('[data-greset]'); if(grs){ delete S.gvals[grs.dataset.greset]; render(); return; }
    const it=t.closest('[data-id]'); if(it){ if(it.dataset.u) openFormula(it.dataset.id,it.dataset.u); else select(it.dataset.id); return; }
    const ch=t.closest('[data-u]'); if(ch&&!ch.disabled){ S.u=ch.dataset.u; S.shown=S.repaso?0:999; renderMain(); return; }
    const vs=t.closest('[data-varsel]'); if(vs){ S.var[S.id]=+vs.dataset.varsel; S.u=null; renderMain(); renderNav(); return; }
    if(t.closest('#big.veil')){ S.reveal=true; renderMain(); return; }
    if(t.closest('#bNext')){ S.shown=(S.shown>=999?0:S.shown)+1; S.anim=S.shown; renderMain(); return; }
    if(t.closest('#bAll')){ S.shown=999; renderMain(); return; }
    if(t.closest('#bReset')){ S.shown=0; renderMain(); return; }
    if(t.closest('#dNext')){ S.ds=(S.ds>=999?0:S.ds)+1; S.danim=S.ds; renderMain(); return; }
    if(t.closest('#dAll')){ S.ds=999; renderMain(); return; }
    if(t.closest('#dReset')){ S.ds=0; renderMain(); return; }
    if(t.closest('#tgR')){ S.repaso=!S.repaso; t.closest('#tgR').setAttribute('aria-pressed',S.repaso); S.reveal=false; S.shown=S.repaso?0:999; S.ds=S.repaso?0:999; renderMain(); return; }
    const fb=t.closest('[data-filt]'); if(fb){ S.filt=fb.dataset.filt; render(); return; }
    const mb=t.closest('[data-mine]'); if(mb){ toggleMine(mb.dataset.mine); render(); return; }
    const gvb=t.closest('[data-gv]'); if(gvb){ openGloss(gvb.dataset.gv); return; }
    const gfb=t.closest('[data-gf]'); if(gfb){ S.gf=gfb.dataset.gf; renderGMain(); return; }
    const ob=t.closest('[data-open]'); if(ob){ openFormula(ob.dataset.open, ob.dataset.k0||(ob.dataset.ok==='1'?S.gv:null)); return; }
    const sum=t.closest('details.grp>summary'); if(sum){ const tid=sum.parentElement.dataset.tema; setTimeout(()=>{ if(sum.parentElement.open) S.closed.delete(tid); else S.closed.add(tid); saveUI(); },0); return; }
    const ts=t.closest('[data-temasave]'); if(ts){ const id=ts.dataset.temasave; const nm=document.querySelector(`[data-tn="${CSS.escape(id)}"]`).value.trim(), mt=document.querySelector(`[data-tm="${CSS.escape(id)}"]`).value.trim();
      if(!nm) return toast('El tema necesita un nombre.'); saveTema({id,nombre:nm,materia:mt||'Otras'}); renderDatos(); toast('Tema guardado.'); return; }
    const eg=t.closest('[data-ejgr]'); if(eg){ S.ejGrM[curMat()]=eg.dataset.ejgr; renderJNav(); saveUI(); return; }
    const th=t.closest('[data-temahide]'); if(th){ const c=ALL.temas.find(x=>x.id===th.dataset.temahide); if(c){ saveTema({id:c.id,nombre:c.nombre,materia:c.materia||'Otras',oculto:!c.oculto}); if(isHid(S.id)) S.id=null; S.confirm=null; toast(c.oculto?`«${c.nombre}» vuelve a verse.`:`«${c.nombre}» oculto. Puedes volver a enseñarlo desde aquí.`); render(); } return; }
    if(t.closest('[data-temadelno]')){ S.confirm=null; render(); return; }
    const tdy=t.closest('[data-temadelyes]'); if(tdy){ const id=tdy.dataset.temadelyes, nm=(ALL.temas.find(x=>x.id===id)||{}).nombre||id; deleteTema(id); S.confirm=null; toast(`Tema «${nm}» borrado.`); render(); return; }
    const td=t.closest('[data-temadel]'); if(td){ const id=td.dataset.temadel, c=temaCont(id); if(c.f+c.e+c.g+c.n+c.d){ S.confirm='tdel:'+id; render(); return; } deleteTema(id); toast('Tema borrado.'); render(); return; }
    const a=t.closest('[data-act]'); if(a){ ACTEL=a; act(a.dataset.act); ACTEL=null; }
  });

  function act(x){
    const f=byId[S.id];
    switch(x){
      case 'new':{ const mat=curMat(); openEditor({id:null,tema:(f&&matOf(f)===mat&&f.tema)||(TEMAS.find(t=>(t.materia||'Otras')===mat)||{}).id||'__new',tipo:'deducida',nombre:'',ecuacion:'',nota:'',pasos:[]},true); return; }
      case 'edit': if(f){ S.confirm=null; openEditor(f,false); } return;
      case 'dup': if(f){ const c=JSON.parse(JSON.stringify(f)); delete c.creado; c.nombre=f.nombre+' (copia)'; c.id=uniqueId(f.id+'_copia'); openEditor(c,true); } return;
      case 'magdel': USER.magnitudes[S.gv]={borrada:true}; rebuild(); pushMeta(); S.gv=null; S.confirm=null; renderGNav(); renderGMain(); toast('Magnitud borrada.'); return;
      case 'magedit': S.confirm=S.confirm==='mag:'+S.gv?null:'mag:'+S.gv; renderGMain(); return;
      case 'magsave':{ const g=id=>document.getElementById(id).value.trim(); const m={simbolo:g('mg-simbolo'),nombre:g('mg-nombre'),unidad:g('mg-unidad')};
        if(!m.simbolo||!m.nombre||!m.unidad) return toast('Símbolo, significado y unidad son obligatorios.');
        if(g('mg-nota')) m.nota=g('mg-nota'); if(g('mg-valor')){ if(isNaN(parseFloat(g('mg-valor').replace(',','.')))) return toast('El valor por defecto debe ser un número.'); m.valor=g('mg-valor').replace(',','.'); }
        saveMag(S.gv,m); S.confirm=null; renderGNav(); renderGMain(); toast('Magnitud guardada.'); return; }
      case 'unlink':{ const [p,c]=S.mapSel; const g=byId[c]; if(g){ saveFormula({...g,deDonde:(g.deDonde||[]).filter(x=>x!==p)}); toast('Enlace quitado.'); } S.mapSel=null; renderMap(); return; }

  document.addEventListener('pointerdown',e=>{ const port=e.target.closest('[data-port]'); if(!port||S.view!=='m') return;
    e.preventDefault(); const svg=document.getElementById('mapsvg'); const id=port.dataset.port; const q=mapModel().pos[id];
    drag={id,svg,x0:q.x+NW,y0:q.y+NH/2,moved:false}; svg.setPointerCapture(e.pointerId); });
  document.addEventListener('pointermove',e=>{ if(!drag) return; const p=svgPt(drag.svg,e); drag.moved=true;
    document.getElementById('tmpl').setAttribute('d',`M${drag.x0} ${drag.y0} L${p.x} ${p.y}`);
    document.querySelectorAll('.nd.drop').forEach(n=>n.classList.remove('drop'));
    const over=document.elementFromPoint(e.clientX,e.clientY); const nd=over&&over.closest&&over.closest('[data-node]'); if(nd&&nd.dataset.node!==drag.id) nd.classList.add('drop'); });
  document.addEventListener('pointerup',e=>{ if(!drag) return; const d=drag; drag=null;
    const over=document.elementFromPoint(e.clientX,e.clientY); const nd=over&&over.closest&&over.closest('[data-node]');
    const tl=document.getElementById('tmpl'); if(tl) tl.setAttribute('d','');
    if(nd&&nd.dataset.node!==d.id){ addLink(d.id,nd.dataset.node); renderMap(); } else if(d.moved) toast('Suelta el enlace encima de otra fórmula.');
    suppressClick=true; setTimeout(()=>{ suppressClick=false; },0); });
  let suppressClick=false;
  document.addEventListener('keydown',e=>{ if(e.target&&e.key==='Enter'&&(e.target.id==='exname'||e.target.id==='grname')){ e.preventDefault(); ACTEL=null; act(e.target.id==='exname'?'ejexsave':'ejgrsave'); } });
  // editor de la impresión
  document.addEventListener('input',e=>{ const t=e.target; if(!PV.src||!t.dataset) return;
    if(t.dataset.pe){ const o=prOpts(), k=t.dataset.pe; o[k]=+t.value; document.getElementById('pvv-'+k).textContent=t.value+t.dataset.u; prSave(); pvApply(); pvLater(); return; }
    if('pecol' in t.dataset){ const o=prOpts(); o.tcol=t.value; prSave(); pvApply(); document.querySelectorAll('.pvsw.on').forEach(b=>b.classList.remove('on')); return; }
    if(t.isContentEditable&&t.dataset.pa){ const src=PV.src.querySelector(`[data-pa="${t.dataset.pa}"]`); if(src){ src.innerHTML=t.innerHTML; PV.dirty=true; } } });
  document.addEventListener('focusout',e=>{ if(!PV.src||!PV.dirty) return; setTimeout(()=>{ const a=document.activeElement; if(a&&a.isContentEditable) return; PV.dirty=false; pvLayout(); },0); });
  document.addEventListener('mouseover',e=>{ if(!PV.src) return; const t=e.target; if(t.closest&&t.closest('#pvtools')) return; const a=pvAtom(t); if(a) { if(a.dataset.pa!==PV.hover||!a.classList.contains('pvhov')) pvHover(a); } else if(t.closest&&!t.closest('.pvpg')) pvHover(null); });
  document.addEventListener('click',e=>{ if(!PV.src) return; const t=e.target; if(!t.closest) return; const pc=t.closest('[data-pcol]'), ps=t.closest('[data-pst]'); if(!pc&&!ps) return; const o=prOpts(); if(pc) o.tcol=pc.dataset.pcol; else o.tstyle=ps.dataset.pst; prSave(); pvPanel(); pvApply(); pvLayout(); });
  document.addEventListener('click',e=>{ if(S.view!=='m') return;
    if(suppressClick){ e.stopPropagation(); return; }
    const eh=e.target.closest('[data-edge]'); if(eh){ S.mapSel=eh.dataset.edge.split('|'); renderMap(); e.stopPropagation(); return; }
    const nd=e.target.closest('[data-node]'); if(nd&&!e.target.closest('[data-port]')){ e.stopPropagation(); openFormula(nd.dataset.node); } },true);

  // --- diagramas: lectura de coordenadas y resaltado al pasar el cursor ---
  document.addEventListener('pointermove',e=>{ if(S.view!=='y') return; const rd_=document.getElementById('dgread'); if(!rd_) return; const P_=e.target.closest&&e.target.closest('#dgsvg')?dgPointer(e):null;
    if(!P_){ rd_.textContent=''; return; } let near=''; (P_.g.lineas||[]).forEach(l=>{ const y=dgLineY(l,P_.x); if(y!==null&&Math.abs(P_.sc.Y(y)-P_.py)<14) near=` · ${strip(l.nombre)}: y = ${strip(fx(y).replace(/<[^>]+>/g,''))}${dgUnit(P_.g.ejeY)}`; });
    rd_.innerHTML=`x = ${fx(P_.x)}${esc(dgUnit(P_.g.ejeX))} · y = ${fx(P_.y)}${esc(dgUnit(P_.g.ejeY))}${esc(near)}`; });
  document.addEventListener('mouseover',e=>{ if(S.view!=='y'||S.dgSel) return; const el=e.target.closest&&e.target.closest('#dgsvg [data-dg]'); const inf=document.getElementById('dginfo'), g=DG.find(x=>x.id===S.dg); if(!inf||!g) return;
    if(el){ const keep=S.dgSel; S.dgSel=el.dataset.dg; inf.innerHTML=dgInfoH(g); S.dgSel=keep; } else if(!e.target.closest('#dginfo')) inf.innerHTML=dgInfoH(g); });

  // --- tooltip de unidades ---
  const tip=document.getElementById('tip'); let pinned=null, cur=null;
  function show(v,pin){ const d=MAG[v.dataset.k]; if(!d) return;
    if(cur&&cur!==v) cur.classList.remove('act'); cur=v; v.classList.add('act');
    const val=v.dataset.val!==undefined?`<div class="tv"><b>Valor</b>${fmtV(+v.dataset.val)??esc(v.dataset.val)} ${esc(d.unidad)}${v.dataset.src?`<div class="tx2">${esc(v.dataset.src)}</div>`:''}</div>`:'';
    tip.innerHTML=`<div class="ts">${symH(d.simbolo)}</div><div class="tn">${esc(d.nombre)}</div><div class="tu"><b>S.I.</b>${esc(d.unidad)}</div>${val}${d.nota?`<div class="tx2">${RT(d.nota)}</div>`:''}${pin?`<button class="tgo" data-gogv="${esc(v.dataset.k)}">Ver en el glosario →</button>`:''}`;
    tip.classList.toggle('pin',!!pin); tip.hidden=false; const r=v.getBoundingClientRect(), w=tip.offsetWidth, hgt=tip.offsetHeight;
    let left=Math.max(8,Math.min(r.left+r.width/2-w/2,innerWidth-w-8)), top=r.bottom+8; if(top+hgt>innerHeight-8) top=r.top-hgt-8;
    tip.style.left=left+'px'; tip.style.top=top+'px'; }
  function hide(){ tip.hidden=true; tip.classList.remove('pin'); if(cur) cur.classList.remove('act'); cur=null; }
  document.addEventListener('mouseover',e=>{ if(pinned) return; const v=e.target.closest('.v[data-k]'); if(v) show(v); else hide(); });
  document.addEventListener('focusin',e=>{ const v=e.target.closest&&e.target.closest('.v[data-k]'); if(v) show(v); });
  document.addEventListener('focusout',e=>{ if(!pinned&&e.target.closest&&e.target.closest('.v[data-k]')) hide(); });
  document.addEventListener('click',e=>{
    const g=e.target.closest('[data-gogv]'); if(g){ e.stopPropagation(); const k=g.dataset.gogv; pinned=null; hide(); openGloss(k); return; }
    if(e.target.closest('#tip')) return;
    const v=e.target.closest('.v[data-k]');
    if(v){ if(pinned===v){ pinned=null; hide(); } else { pinned=v; show(v,true);} } else { pinned=null; hide(); } },true);
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ pinned=null; hide(); if(document.body.classList.contains('printing')) pvClose(); } if(e.altKey&&e.key==='ArrowLeft'){ e.preventDefault(); back(); } });
  addEventListener('scroll',()=>{ if(pinned){ pinned=null; hide(); } },{passive:true,capture:true});
}
if(typeof document!=='undefined') boot();
// la cuadrícula se ajusta a la interfaz: el marco de la asignatura mide un número exacto de celdas y las líneas del fondo parten de su esquina
function gridAlign(){ const GRID=22, wrap=document.querySelector('.wrap'), sp=document.querySelector('.space'), lay=document.getElementById('layout'); if(!wrap||!sp||!sp.offsetWidth) return;
  const root=document.documentElement, cs=getComputedStyle(sp), wc=getComputedStyle(wrap), b=parseFloat(cs.borderLeftWidth)||0, pad=parseFloat(wc.paddingLeft)+parseFloat(wc.paddingRight), vw=root.clientWidth;
  const inner=Math.floor((Math.min(1280,vw)-pad-b)/GRID)*GRID+b, w=inner+pad, l=Math.max(0,Math.floor((vw-w)/2));
  root.style.setProperty('--wrapw',w+'px'); root.style.setProperty('--wrapl',l+'px'); root.style.setProperty('--wrapr','0px');
  const r=sp.getBoundingClientRect(), x=r.left+window.scrollX, y=r.top+window.scrollY, nat=lay.getBoundingClientRect().bottom-r.top+parseFloat(cs.paddingBottom)+parseFloat(cs.borderBottomWidth);
  root.style.setProperty('--spmh',Math.ceil((nat-b)/GRID)*GRID+b+'px');
  const m=v=>((v%GRID)+GRID)%GRID; document.body.style.backgroundPosition=m(x)+'px '+m(y)+'px'; }
window.addEventListener('resize',()=>{ gridAlign(); dgLayout(); });
document.addEventListener('pointerdown',e=>{ const h=e.target.closest&&e.target.closest('#dgrz'); if(!h) return; e.preventDefault();
  const col=document.querySelector('.dgcol'), wrap=document.querySelector('.dgwrap'), id=S.dg, x0=e.clientX, y0=e.clientY, w0=col.getBoundingClientRect().width; try{ h.setPointerCapture(e.pointerId); }catch(_){}
  const mv=ev=>{ const dx=ev.clientX-x0, dy=(ev.clientY-y0)*DGW/DGH; S.dgW[id]=Math.round(Math.max(280,Math.min(wrap.clientWidth,w0+(Math.abs(dx)>Math.abs(dy)?dx:dy)))); dgLayout(); };
  const up=()=>{ ['pointermove','pointerup','pointercancel'].forEach((n,i)=>h.removeEventListener(n,i?up:mv)); saveUI(); };
  h.addEventListener('pointermove',mv); h.addEventListener('pointerup',up); h.addEventListener('pointercancel',up); });
document.addEventListener('dblclick',e=>{ if(e.target.closest&&e.target.closest('#dgrz')){ delete S.dgW[S.dg]; dgLayout(); saveUI(); } });
if(typeof ResizeObserver!=='undefined'){ let raf=0; const ro=new ResizeObserver(()=>{ cancelAnimationFrame(raf); raf=requestAnimationFrame(gridAlign); }); ['html','#mats','header','#layout'].forEach(q=>{ const el=document.querySelector(q); if(el) ro.observe(el); }); }
gridAlign();
if(typeof module!=='undefined') module.exports={parseEq,parseSide,solve,ev,vlist,count,validatePack,applyPack,rebuild,extractJSON,catalogo,promptFull,
  get F(){return F;}, get MAG(){return MAG;}, get TEMAS(){return TEMAS;}, get byId(){return byId;}, getEq, chainH, RT, S, setUSER:u=>{USER=u;}};
